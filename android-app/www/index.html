<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" id="metaTheme" content="#ffffff">
<meta name="description" content="Pixel Dino: Parkour Run. An offline-Chrome-dino parody runner: jump, slide, rail-grind cacti and fire rockets. One self-contained HTML file, no libraries, no build step.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Pixel Dino: Parkour Run</title>
<style>
  :root { color-scheme: light; --paper:#ffffff; --ink:#535353; --soft:#8f8f8f; --hair:#dcdcdc; --pad:rgba(255,255,255,.76); }
  :root.night { color-scheme: dark; --paper:#0e0e0e; --ink:#ededed; --soft:#8a8a8a; --hair:#3a3a3a; --pad:rgba(14,14,14,.72); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--paper); color: var(--ink);
    font-family: "Courier New", Courier, monospace;
    overflow: hidden; overscroll-behavior: none;
    touch-action: none; user-select: none; -webkit-user-select: none;
    transition: background-color .3s ease, color .3s ease;
  }
  /* Fullscreen landscape on a notched phone: the insets live on the body, not on
     the game box, so a notch, a rounded corner or a gesture bar can never clip
     the dino, the HUD or the touch pad — and #wrap, which the resizer measures,
     is already inset by the time the game asks how big it is. */
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #wrap {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding-bottom: var(--padroom, 0px);
  }
  /* AUTO LANDSCAPE.  A phone held upright is asked — never told, never a button
     — to turn: the whole game box rotates 90 degrees about its own centre.  The
     swap is the entire trick.  A 400x850 portrait viewport cannot hold a 16:9
     box, but a 850x400 one holds it perfectly; so the wrapper is sized to the
     SWAPPED viewport and then rotated, which is the same as asking the browser
     for landscape without the device ever physically turning. */
  #wrap.rot {
    position: fixed;
    top: 50%; left: 50%;
    width: var(--rw, 100vh); height: var(--rh, 100vw);
    transform: translate(-50%, -50%) rotate(90deg);
    transform-origin: center center;
    padding-bottom: 0;              /* the pad lives inside the game box already */
  }
  /* The transition is deliberately short: a half-second spin on launch reads as
     a loading animation nobody asked for, and a long one leaves the player
     tapping a picture that is still turning. */
  #wrap { transition: transform .22s ease; }
  body.rot { overflow: hidden; }
  #shell { position: relative; overflow: hidden; background: var(--paper); transition: background-color .3s ease; box-shadow: 0 0 0 1px var(--hair); }
  /* 16:9 is stated, not just computed: resize() sets the width and this rule
     derives the height, so the box can never end up a fraction off-ratio from a
     rounding step.  The ratio is also written into CFG, so the layout and the
     resizer are reading the same number. */
  #shell { aspect-ratio: 16 / 9; height: auto; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }

  /* the chips ride on the game itself, not on the page */
  #topbar { position: absolute; top: max(5px, 1.1vmin); right: max(6px, 1.4vmin); display: flex; gap: min(7px, .9vmin); z-index: 3; }
  .chip {
    font: 700 clamp(9px, calc(var(--u, 300px) * .040), 13px)/1 "Courier New", Courier, monospace; letter-spacing: .07em;
    color: var(--soft); background: var(--paper); border: 1px solid var(--hair); border-radius: 999px;
    padding: clamp(4px, calc(var(--u, 300px) * .022), 7px) clamp(7px, calc(var(--u, 300px) * .034), 12px);
    cursor: pointer; touch-action: manipulation;
    transition: background-color .3s ease, color .3s ease, border-color .3s ease;
  }
  .chip:active { color: var(--ink); border-color: var(--soft); }
  .chip.off { opacity: .4; }
  .chip[hidden] { display: none; }
  /* the install chip only exists once the browser says the app is installable */
  #bInstall { border-color: #2aa9b8; color: #1d7f8b; }
  :root.night #bInstall { border-color: #57dfec; color: #57dfec; }

  /* A single responsive bar pinned to the bottom of the game box: six equal
     buttons that live in the empty strip below the ground line, so they never
     cover the road. Every size is a fraction of --u (the on-screen game
     height), so the bar scales with the canvas instead of drifting off it. */
  #pad {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: calc(var(--u, 300px) * .155);
    display: none; align-items: stretch; gap: calc(var(--u, 300px) * .011);
    padding: calc(var(--u, 300px) * .013); pointer-events: none; z-index: 2;
  }
  body.touch #pad { display: flex; }
  /* a modal owns the screen: get the buttons out from under it */
  body.modal #pad { opacity: 0; pointer-events: none; }
  body.modal #pad .btn { pointer-events: none; }
  /* The same has to happen to the top-right chips.  A panel is 213 of the 216
     world units tall and 344 of 384 wide, so the chips — which live in the
     shell's own top-right corner — are not "near" it, they are *inside* it, and
     they were printing 👑 GO PRO / PAUSE / SOUND straight across the panel's own
     ACTIVE label and its high score.  There is no box to move them to, so they
     leave instead, and come straight back when the panel closes. */
  body.modal #topbar { opacity: 0; pointer-events: none; }
  #topbar { transition: opacity .16s ease; }
  /* The tag field.  It is sized and placed in PERCENTAGES of the 16:9 shell
     from the same world coordinates the canvas draws the field with, so the ink
     you see is the game's and the caret is the platform's, and neither of them
     can drift out of register with the other — at any screen size, with no
     resize handler.  It covers the field alone, never the panel, so the
     panel's own buttons stay tappable. */
  #namebox {
    position: absolute; z-index: 4; display: none;
    margin: 0; padding: 0; border: 0; outline: 0; background: transparent;
    color: transparent; caret-color: transparent;
    font: 700 16px/1 "Courier New", Courier, monospace;
    -webkit-user-select: text; user-select: text; text-align: center;
  }
  /* body.typing lifts the user-select ban the game needs everywhere else, so
     the field is actually editable instead of silently eating every keystroke */
  body.typing, body.typing * { -webkit-user-select: text; user-select: text; }
  #namebox.on { display: block; }
  #pad, .btn { transition: opacity .16s ease, background-color .3s ease, color .3s ease, border-color .3s ease, transform .07s ease; }
  .btn {
    position: relative; flex: 1 1 0; min-width: 0; pointer-events: auto;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font: 700 clamp(8px, calc(var(--u, 300px) * .024), 13px)/1.02 "Courier New", Courier, monospace; letter-spacing: .02em;
    color: var(--ink); background: var(--pad);
    border: 2px solid var(--ink); border-radius: 999px;
    touch-action: none; -webkit-user-select: none; user-select: none;
    white-space: nowrap; overflow: hidden;
  }
  .btn.on { background: var(--ink); color: var(--paper); transform: scale(.94); }
  .btn.dim { opacity: .38; }
  /* JUMP is the one control you cannot play without, so it is the widest key on
     the bar and the only one whose face is already filled. */
  #bJump { flex: 1.9 1 0; border-width: 3px; background: var(--ink); color: var(--paper); font-size: clamp(9px, calc(var(--u, 300px) * .027), 14px); }
  #bJump.on { background: var(--paper); color: var(--ink); }
  #bPro {
    border-color: #d9a520; color: #a87a10; background: #fffaea;
    box-shadow: 0 0 0 1px rgba(217,165,32,.3), 0 0 12px rgba(217,165,32,.45);
    animation: proGlow 1.7s ease-in-out infinite;
  }
  :root.night #bPro { color: #e3ba4c; border-color: #8a6a1c; background: #221b09; }
  #bPro.active { animation: none; color: #fff6d8; border-color: #d9a520; background: #6b4f0d; }
  @keyframes proGlow {
    0%, 100% { box-shadow: 0 0 0 1px rgba(217,165,32,.28), 0 0 8px rgba(217,165,32,.35); }
    50%      { box-shadow: 0 0 0 1px rgba(217,165,32,.6),  0 0 20px rgba(217,165,32,.8); }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="shell">
    <canvas id="game" width="768" height="432"></canvas>

    <div id="topbar">
      <div class="chip" id="bInstall" role="button" tabindex="-1" hidden aria-label="Install Pixel Dino as an app">⬇ INSTALL</div>
      <div class="chip" id="bPro" role="button" tabindex="-1" aria-label="Open the DINO PRO pass">👑 GO PRO</div>
      <div class="chip" id="bPause" role="button" tabindex="-1">PAUSE</div>
      <div class="chip" id="bSound" role="button" tabindex="-1">SOUND</div>
    </div>

    <!-- The player tag is typed, and a tag on a phone needs the phone's own
         keyboard: a canvas-drawn text field with a hand-rolled key handler is
         unusable with a thumb and cannot spell.  So the field is a real input,
         transparent and sitting exactly over the canvas's own field, and the
         game draws the frame, the caret and the button around it. -->
    <input id="namebox" maxlength="12" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" aria-label="Player tag">

    <div id="pad">
      <div class="btn" id="bGrind" role="button" tabindex="-1" aria-label="Hold to slide or rail-grind a cactus">↓ GRIND</div>
      <div class="btn" id="bSlow" role="button" tabindex="-1" aria-label="Bullet time">SLOW</div>
      <div class="btn" id="bParry" role="button" tabindex="-1" aria-label="Timed parry, double-tap for the Laser Roar">PARRY</div>
      <div class="btn" id="bRocket" role="button" tabindex="-1" aria-label="Fire a rocket">ROCKET</div>
      <div class="btn" id="bHook" role="button" tabindex="-1" aria-label="Grapple up to a cloud or pterodactyl">HOOK</div>
      <div class="btn" id="bRide" role="button" tabindex="-1" aria-label="Deploy or stow the hoverboard">RIDE</div>
      <div class="btn" id="bJump" role="button" tabindex="-1" aria-label="Jump — tap again in the air to backflip">JUMP</div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   Pixel Dino: Parkour Run
   A single-file parody of the Chrome offline T-Rex runner.

   - Sprite art is the real thing: rect tables traced 1:1 from the official
     Chromium offline sprite sheet (T-Rex 44x47, ducking 55x25, cacti, cloud,
     pterodactyl).
   - Physics follows Chrome's own numbers: jump velocity 10 + speed/10, gravity
     0.6 per 60Hz frame, and a deliberately unhurried speed curve — a 4.4 walk
     held for the first 10,500m, then a smoothstep up to 9.6 by the tower.
   - Touch: a responsive six-button bar below the road (↓ GRIND, SLOW, PARRY,
     ROCKET, HOOK, RIDE), jumping on a tap of the field, plus swipe up / swipe
     down.  The run is a 100,000m journey with five boss gates, a checkpoint
     every 10,000m and a tower at the finish line.
   Pure white paper, a single #535353 ink, no libraries, no build step.  The
   page also ships a manifest and a service worker, so the same file installs
   as an app and can be wrapped into an Android APK (see ANDROID.md).
   ========================================================================== */

/* ------------------------------- helpers ---------------------------------- */
const WW = 384, WH = 216, GROUND = WH - 56, STEP = 1000 / 60;
/* Day is Chrome's white paper + one ink.  Night is the same world inverted;
   the two palettes are cross-faded per frame so the sky change is smooth.  */
const DAYC = { paper: "#ffffff", ink: "#535353", soft: "#8f8f8f", faint: "#c9c9c9", pebble: "#c4c4c4", cloud: "#c8c8c8", star: "#ffffff", gold: "#c39a24", cyan: "#2aa9b8", red: "#c4382c", pale: "#e7cf88" };
const NIGHTC = { paper: "#0e0e0e", ink: "#ededed", soft: "#8a8a8a", faint: "#5f5f5f", pebble: "#6b6b6b", cloud: "#0e0e0e", star: "#dcdcdc", gold: "#e3ba4c", cyan: "#57dfec", red: "#f2564a", pale: "#f5e2ae" };
/* Chrome's own incognito grey, #202124, with the dino drawn in near-white */
const INCOG = { paper: "#202124", ink: "#e8eaed", soft: "#9aa0a6", faint: "#3c4043", pebble: "#3c4043", cloud: "#202124", star: "#5f6368", gold: "#e3ba4c", cyan: "#57dfec", red: "#f2564a", pale: "#f5e2ae" };
let PAPER = DAYC.paper, INK = DAYC.ink, SOFT = DAYC.soft, FAINT = DAYC.faint,
    PEBBLE = DAYC.pebble, CLOUD = DAYC.cloud, STAR = DAYC.star,
    GOLD = DAYC.gold, CYAN = DAYC.cyan, RED = DAYC.red, PALE = DAYC.pale;
/* 0 = the scene ink, 1 gold, 2 cyan, 3 red, 4 paper, 5 pale gold.  Skin
   accessories pick from this so a hat, a visor and a crown can be coloured
   while the dino itself stays exactly the Chrome sprite. */
const ACCENT = [null, DAYC.gold, DAYC.cyan, DAYC.red, DAYC.paper, DAYC.pale];
function mixHex(a, b, t) {
  if (t <= 0) return a;
  if (t >= 1) return b;
  const p = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  const A = p(a), B = p(b), h = v => Math.round(v).toString(16).padStart(2, "0");
  return "#" + h(A[0] + (B[0] - A[0]) * t) + h(A[1] + (B[1] - A[1]) * t) + h(A[2] + (B[2] - A[2]) * t);
}
function applyNight(t) {
  /* incognito overrides the sky entirely: Chrome's dark grey, whatever the hour */
  const on = P.spy > 0;
  const pick2 = k => on ? INCOG[k] : mixHex(DAYC[k], NIGHTC[k], t);
  PAPER = pick2("paper"); INK = pick2("ink"); SOFT = pick2("soft"); FAINT = pick2("faint");
  PEBBLE = pick2("pebble"); CLOUD = pick2("cloud"); STAR = pick2("star");
  GOLD = mixHex(DAYC.gold, NIGHTC.gold, t);
  CYAN = mixHex(DAYC.cyan, NIGHTC.cyan, t);
  RED = mixHex(DAYC.red, NIGHTC.red, t);
  PALE = mixHex(DAYC.pale, NIGHTC.pale, t);
  ACCENT[1] = GOLD; ACCENT[2] = CYAN; ACCENT[3] = RED; ACCENT[4] = PAPER; ACCENT[5] = PALE;
}
const FONT = '"Courier New", Courier, monospace';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a = 1, b = 0) => b + Math.random() * (a - b);
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[(Math.random() * a.length) | 0];

/* --------------------------- the real sprite art ---------------------------

const ART = {

               "0,0,2,6;37,1,16,3;2,2,4,6;14,2,17,15;35,3,2,11;53,3,2,9;6,4,8,8;31,4,4,10;37,4,2,12;41,4,12,8;39,6,2,10;4,8,2,2;8,12,6,2;41,12,4,4;10,14,4,2;31,14,2,3;45,14,6,2;12,16,2,6;14,17,10,1;29,17,2,4;11,18,1,7;14,18,3,2;21,18,5,2;31,19,2,2;14,20,1,2;12,22,1,3;13,24,2,1"],

  /* the 10,000m finish line: a lattice mast under a signal dome */

const SAVE_KEY = "dinoexe.save.v2";
/* A tag is trimmed to printable ASCII and twelve characters.  It is the member
   name of every entry on the global board, so it has to be a key that two
   players cannot both claim by accident and one that can never be a newline. */
const NAME_MAX = 12;
const cleanName = v => String(v === undefined || v === null ? "" : v)
  .replace(/[^\x20-\x7E]/g, " ").replace(/\s+/g, " ").trim().slice(0, NAME_MAX);

              pid: "", gtag: "" };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || "{}")); } catch (e) {}
function sanitiseSave() {
  /* a tag has to survive being a Redis member name and a table cell: no
     control characters, no leading or trailing spaces, twelve characters */

  const ids = SKINS.map(s => s.id);
  save.owned = (Array.isArray(save.owned) ? save.owned : []).filter(id => ids.indexOf(id) >= 0);
  if (save.owned.indexOf("classic") === -1) save.owned.unshift("classic");
  if (save.pro && save.owned.indexOf("gold") === -1) save.owned.push("gold");
  if (ids.indexOf(save.skin) === -1 || save.owned.indexOf(save.skin) === -1) save.skin = "classic";
  save.coins = Math.max(0, save.coins | 0);
  save.best = Math.max(0, save.best | 0);
  save.bestM = Math.max(0, save.bestM | 0);
  save.champ = Math.max(0, save.champ | 0);
  save.boards = Math.max(0, Math.min(99, save.boards | 0));
  save.pro = !!save.pro;

  /* the tag is what the whole global board is keyed by, so it is trimmed,
     printable-ASCII only and hard-capped — two people cannot both be " Rex " */
  save.name = cleanName(save.name);

     it is shape-checked here exactly like the tag.  A Player ID is digits; a
     GamerTag is a tag.  Anything else is not an identity and is not stored. */
  save.pid = /^[0-9]{4,24}$/.test(String(save.pid || "")) ? String(save.pid) : "";

/* --------------------------- the global leaderboard ----------------------- */
/* This is a real server, not a list of made-up rivals.  The board is a sorted
   set in an Upstash Redis database, read and written straight from the browser
   with fetch: no SDK, no npm, no backend of our own, so "one file, zero
   dependencies, no build step" survives the feature.  Redis does the sorting,
   which is why the board is genuinely global and genuinely ordered by the
   server rather than by whoever rendered it.

   >>> PASTE YOUR CREDENTIALS HERE <<<
   Upstash console -> your database -> Connection -> REST URL and Token.

   Honest about what this is: the token has to be readable by every client, so
   anybody can edit the page and submit a fake distance.  That is the same trade
   every browser-only leaderboard makes — Dreamlo, which this was measured
   against, has exactly the same hole and a decade of complaints about it.  It
   is fine for an arcade high-score table.  It is not a prize table, and the
   only honest fix for that is a server that checks the run, which would mean
   this file no longer being the whole game. */
const LB = {
  url: "", token: "",           /* <- your Upstash REST URL and Token        */
  key: "pixeldino:lb:v1",        /* the sorted set every run is added to       */
  skins: "pixeldino:skins:v1",   /* tag -> the skin they were wearing, as a hash */
  top: 50,                       /* how many rows the board will draw          */
};
/* Everything the modal knows about the server, in one object, so the UI never
   has to ask whether a fetch is in flight and can never paint a half-answer. */
const LBS = {
  rows: [], rank: 0, total: 0, busy: false, live: false,
  status: "",                    /* "", "CONNECTING", "LIVE", "OFFLINE"       */
  stamp: 0,                      /* when the board was last actually fetched  */
  sent: 0,                       /* your best distance the server has accepted */
  err: "",
};
const lbOn = () => !!(LB.url && LB.token) && typeof fetch === "function";
/* One Redis command over plain HTTPS.  Upstash takes the whole command as a
   JSON array in the body and answers {"result": ...} or {"error": "..."}. */
async function lbCmd(cmd) {
  if (!lbOn()) throw new Error("no endpoint");
  const r = await fetch(LB.url, {
    method: "POST",
    headers: { "Authorization": "Bearer " + LB.token, "Content-Type": "application/json" },
    body: JSON.stringify(cmd),
    cache: "no-store",
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  if (j && j.error) throw new Error(String(j.error));
  return j ? j.result : null;
}
/* The entry is two writes, not one, and the split is deliberate: the sorted set
   is keyed by TAG alone, so re-running under a new tag raises the one entry
   instead of littering the board with the same person's old rows — while the
   skin lives in a hash beside it, where changing it costs nothing. */
async function lbFetch() {
  if (!lbOn()) { LBS.status = "OFFLINE"; LBS.live = false; LBS.err = "NO ENDPOINT"; return; }
  LBS.status = "CONNECTING"; LBS.busy = true; LBS.err = "";
  try {
    const flat = await lbCmd(["ZREVRANGE", LB.key, "0", String(LB.top - 1), "WITHSCORES"]);
    const skins = await lbCmd(["HGETALL", LB.skins]) || [];
    const wear = {};
    for (let i = 0; i + 1 < skins.length; i += 2) wear[skins[i]] = skins[i + 1];
    const out = [];
    for (let i = 0; i + 1 < flat.length; i += 2) {
      const m = Math.round(+flat[i + 1]);
      if (!isFinite(m)) continue;
      out.push({ n: cleanName(flat[i]) || "???", k: wear[cleanName(flat[i])] || "classic", m });
    }
    /* ZREVRANGE is already descending, but the board is drawn from this array
       and a server that ever answers out of order must not be able to print a
       leaderboard that is not one */
    out.sort((a, b) => b.m - a.m || (a.n < b.n ? -1 : a.n > b.n ? 1 : 0));
    LBS.rows = out;
    if (save.name) {
      const at = out.findIndex(r => r.n === save.name);
      /* inside the visible page the rank is the row; past it, only the server
         knows, so ask it rather than guessing "somewhere below row 50" */
      if (at >= 0) LBS.rank = at + 1;
      else {
        const r = await lbCmd(["ZREVRANK", LB.key, save.name]);
        LBS.rank = r === null || r < 0 ? 0 : r + 1;
      }
      const mine = out.find(x => x.n === save.name);
      LBS.sent = mine ? mine.m : LBS.sent;
    } else { LBS.rank = 0; LBS.sent = 0; }
    try { LBS.total = +await lbCmd(["ZCARD", LB.key]) || LBS.rows.length; } catch (e) {}
    LBS.live = true; LBS.status = "LIVE"; LBS.stamp = Date.now();
  } catch (e) {
    /* A leaderboard that cannot be reached must say so.  Silently showing an
       empty board would read as "nobody has played", which is a lie. */
    LBS.live = false; LBS.status = "OFFLINE"; LBS.err = String(e.message || e).slice(0, 24).toUpperCase();
    LBS.rows = []; LBS.rank = 0;
  }
  LBS.busy = false;
}
/* Submitting is a personal best and nothing else: a second run that is worse
   must never move an entry, and a run with no tag has nothing to file under.

   ZADD on its own is an OVERWRITE, not a maximum — a player who crashes at
   12,000m after a 240,000m run would erase their own record, and the board
   would be a table of latest crashes.  GT CH is the fix and it is one flag:
   raise the score only if the new one is greater, and only report genuinely
   new members. */
async function lbSubmit() {
  if (!save.name || !lbOn()) return false;
  const m = Math.max(1, Math.floor(G.meters));
  try {
    await lbCmd(["ZADD", LB.key, "GT", "CH", String(m), save.name]);
    await lbCmd(["HSET", LB.skins, save.name, save.skin]);
    LBS.sent = Math.max(LBS.sent, m);
    return true;
  } catch (e) {
    LBS.err = String(e.message || e).slice(0, 24).toUpperCase();
    return false;
  }
}

/* --------------------- Google Play Games Services (PGS) ------------------- */
/* The Android host injects ONE object into the WebView, and this game talks to
   nothing else.  The entire contract is four methods, all promises:

       window.PlayGames.autoSignIn()          -> { playerId, gamerTag, iconUrl }
       window.PlayGames.loadSnapshot(slot)    -> the object you last saved
       window.PlayGames.saveSnapshot(slot, o) -> acknowledged
       (getPlayerInfo() is honoured if the host has it, and never required)

   Outside the APK — a desktop browser, a hosted preview, a PWA — there is no
   such object, and the game must be EXACTLY the same game.  So the adapter
   treats the bridge as optional: it is detected, it is never assumed, it
   never throws, and nothing waits on it.  A player in a browser gets the
   local nickname and, failing that, "Dino_Player" — and never a spinner, a
   dialog, a permission prompt or a console error.

   Every field that comes back is validated rather than trusted.  This is the
   only value in the game that arrived from somewhere we do not control, and
   a Player ID goes straight into a save file, a cloud slot and a hashed
   identicon. */
const PG = {

/* ------------------------ Google Play Billing (DINO PRO) ---------------- */
/* Google Play's payments policy is unambiguous: a digital item sold on Android
   has to go through Play Billing.  Stripe and Paddle are both rejected, and an
   APK that takes money any other way is a takedown risk rather than a business.

   So the pass is a ONE-TIME non-consumable, not a subscription: nothing expires,
   nothing renews, nothing has to be cancelled.  That is both the honest product
   and the simplest thing that satisfies the policy.

   The same rule that governs the leaderboard and Play Games governs this one:
   the bridge is optional.  In a browser there is no PlayBilling, the panel
   says the pass is FREE, and the game is completely unlocked — because the
   promise of this repository is still "open index.html and you are playing",
   and a checkout that cannot take money is worse than no checkout.  A PRICE is
   only ever printed when a live billing bridge is behind it, which is exactly
   what Play's policy requires and exactly what the harness asserts. */
const BILL = {
  sku: "dino_pro_lifetime",   /* the product id as it appears in Play Console */
  price: "$2.99",             /* the label; Play overrides it with the real one */
};
const BILLS = {
  store: false,     /* a BillingClient EXISTS on this device            */
  on: false,        /* ...and it ANSWERED, so a price can be quoted     */
  owned: false,     /* this account owns DINO PRO                       */
  busy: false,      /* a purchase is in flight                          */
  price: BILL.price,
  bought: 0,        /* purchases completed this session                 */
  restored: 0,      /* times a pass came back without being asked for   */
  err: "",
};
function billBridge() {
  try {
    if (typeof window === "undefined") return null;
    if (window.PlayBilling) return window.PlayBilling;
    const cap = window.Capacitor;
    if (cap && cap.Plugins && cap.Plugins.PlayBilling) return cap.Plugins.PlayBilling;
  } catch (e) { /* a hostile host must not be able to charge or block us */ }
  return null;
}
/* Ownership is asked for, never assumed: a player who paid and reinstalled
   gets the pass back, and a player who never paid must not get it by accident. */
async function billQuery(quiet) {
  const b = billBridge();
  /* A store that EXISTS and a store that ANSWERS are different facts, and
     collapsing them is how a broken BillingClient turns into a free pass. */
  BILLS.store = !!b;
  if (!b || typeof b.queryPurchases !== "function") { BILLS.on = false; BILLS.owned = save.pro; return false; }
  try {
    const r = await pgWait(b.queryPurchases(BILL.sku), CFG.PLAY_WAIT);
    if (!r) { BILLS.err = "NO ANSWER"; return false; }
    BILLS.on = true;
    BILLS.owned = !!(r.owned || (Array.isArray(r.skus) && r.skus.indexOf(BILL.sku) >= 0));
    /* the price is the STORE's, never ours: a hard-coded "$2.99" on a sale in
       a new region is a charge the player did not agree to */
    if (typeof r.price === "string" && /^[$\u20ac\u00a3]\s?[\d.,]+$/.test(r.price)) BILLS.price = r.price;
    BILLS.err = "";
    /* A pass this account already owns is restored SILENTLY and automatically.
       Reinstalling, switching phones or a cleared browser must not take
       something a player paid for away, and re-asking them for it would be
       the single most likely way to fail a Play review. */
    if (BILLS.owned && !save.pro) { BILLS.restored++; givePro("restored"); }
    else if (save.pro) BILLS.owned = true;
    return BILLS.owned;
  } catch (e) {
    BILLS.err = String((e && e.message) || e).slice(0, 20).toUpperCase();
    return false;

}
/* The flow is launched by the bridge; the page this host is given back is the
   only place a resume can arrive on, so the loop is bounded rather than
   endless.  Everything it reports is treated as untrusted. */
async function billPurchase() {
  const b = billBridge();
  BILLS.store = !!b;
  if (!b || typeof b.launchBillingFlow !== "function") {
    /* genuinely no store here — the web build grants the pass outright */
    if (givePro("free")) { Snd.sfx.buy(); toast("PRO ACTIVATED - GOLDEN DINO UNLOCKED"); }
    return true;
  }
  if (BILLS.busy) return false;
  BILLS.busy = true; BILLS.err = "";
  let timedOut = false;
  try {
    let page = null;
    for (let i = 0; i < 3 && page !== "done"; i++) {
      page = await pgWait(b.launchBillingFlow(BILL.sku, i), CFG.PLAY_WAIT);
      /* the store never answered: that is an outage, not a player changing
         their mind, and it must not be reported as a cancellation */
      if (page === null) { timedOut = true; break; }
      if (typeof page.price === "string" && /^[$\u20ac\u00a3]\s?[\d.,]+$/.test(page.price))
        BILLS.price = page.price;
    }
    if (timedOut) {
      BILLS.err = "TIMEOUT";
      G.proMsg = "PAYMENTS UNAVAILABLE - PLEASE TRY AGAIN"; G.proMsgT = 140;
    } else if (await billQuery(false)) {
      BILLS.bought++;
      givePro("bought");
      Snd.sfx.buy();
      shopMsgSave();
      G.proMsg = "THANK YOU - PRO IS YOURS FOREVER"; G.proMsgT = 140;
    } else {
      BILLS.err = "CANCELLED";
      shopMsgSave();
      G.proMsg = "NOT PURCHASED - YOU CAN STILL PLAY EVERYTHING"; G.proMsgT = 140;
    }
  } catch (e) {
    BILLS.err = String((e && e.message) || e).slice(0, 20).toUpperCase();
    /* A store that is BROKEN is not a store that is absent.  Falling back to a
       free pass here would hand every player with a flaky BillingClient the
       paid thing for nothing, and a free tier on an app that sells a purchase
       is exactly what Play's payments policy exists to prevent. */
    G.proMsg = "PAYMENTS UNAVAILABLE - PLEASE TRY AGAIN"; G.proMsgT = 140;
  }
  BILLS.busy = false;
  return BILLS.owned;

/* ---------------------- Google Play achievements ------------------------- */
/* Free, and the cheapest retention lever there is: an achievement is a reason
   to come back tomorrow, and Play puts them on the product page where the
   store ranks the app.  Seven of them, each on something the player already
   does, and each worth more than the price of the pass.

   They are EVALUATED, never sprinkled: every moment the game has new numbers
   calls achCheck(), and it fires whatever is now true and has not been fired
   yet.  One place to read, one place to test — and a check can never be
   forgotten by a new line of code that happens to beat a boss. */
const ACHS = [
  ["CGI_CRASH",  "FIRST 404",   "Crash into the offline dinosaur."],
  ["WIFI_1K",    "FIRST SIGNAL", "Reach the first 1,000m."],
  ["BOSS_1",     "GATE ONE",    "Beat your first boss gate."],
  ["BOSS_ALL",   "ALL GATES",   "Beat all five boss gates."],
  ["GLORY_100K", "CERTIFIED",   "Finish the 100,000m journey."],
  ["OVERDRIVE",  "OVERDRIVE",   "Reach 250,000m in Legendary Overdrive."],
  ["STYLIST",    "WARDROBE",    "Own every skin in the game."],

function achBridge() {
  const b = pgBridge();

   retry, and never worth blocking a run on. */

  if (!ACH.on || ACH.got[id]) return false;
  const f = achBridge();
  if (!f) return false;
  ACH.got[id] = true;
  try { f(id); } catch (e) { /* nothing to do, and nothing to show */ }

  return true;
}
function achCheck() {
  if (!ACH.on) return 0;
  let n = 0;
  const fire = (id, ok) => { if (ok && unlock(id)) n++; };
  fire("CGI_CRASH", save.best > 0 || save.champ > 0);
  fire("WIFI_1K", save.bestM >= 1000);
  fire("BOSS_1", G.bosses.some(Boolean));
  fire("BOSS_ALL", G.bosses.filter(Boolean).length >= BOSSES.length);
  fire("GLORY_100K", save.champ > 0);
  fire("OVERDRIVE", save.bestM >= 250000);
  fire("STYLIST", SKINS.every(s => save.owned.indexOf(s.id) >= 0));
  return n;
}

/* ---------------------------- the player tag ------------------------------ */
/* Typing is the one thing a canvas genuinely cannot do well, so the field is a
   real <input> placed over the canvas's own drawn field (see #namebox in the
   stylesheet) and everything around it — the frame, the caret's label, the
   rules, the buttons — is drawn by the game like every other pixel. */
const NAME_FIELD = { x: 78, y: 0, w: 228, h: 22 };     /* world units, set by layout */
const nameBox = () => document.getElementById("namebox");
/* Ask for the keyboard.  Only ever called with the field displayed and from
   inside a real gesture, which is the only moment a browser allows a programmatic
   focus to raise the soft keyboard. */
function focusNameBox() {
  const el = nameBox();
  if (el && el.classList && el.classList.contains("on") && el.focus)
    { try { el.focus(); } catch (e) {} }
}
function openName(from) {
  G.nameFrom = from || "ready"; G.name = save.name;
  G.state = "name"; G.nameT = 0; held.padSlide = false;
  const el = nameBox();
  if (el) {
    if (typeof el.value === "string") el.value = save.name;
    if (el.classList) el.classList.add("on");
    /* focus is user-activation-gated on some browsers and must be asked for
       from inside the gesture, so it is asked for here and again on the panel's
       first tap (see fieldPress) */
    focusNameBox();
  }
  if (document.body && document.body.classList) document.body.classList.add("typing");
  Snd.init(); Snd.sfx.click();
}
/* `keep` is false for exactly one caller — the SKIP key, the only control in
   the game that means "no tag".  Escape is NOT a second SKIP: it is what the
   Android soft keyboard's BACK key sends, so a player who typed a tag, dismissed
   the keyboard and expected to keep it was silently losing it — and then
   running under the old tag with no way to tell why.  Everything else commits
   whatever is in the field, which is what every other field in every other
   program does. */
function commitName(keep) {
  const el = nameBox();
  let v = G.name;
  if (el && typeof el.value === "string" && el.value !== undefined) v = el.value;
  save.name = keep === false ? "" : cleanName(v);
  G.name = save.name;
  /* Asked once per session, whichever way it was answered: a player who has
     already dealt with this panel does not get it again on their first crash,
     which is how a panel turns into something you tap through. */
  G.nameAsked = true;
  persist();
  const back = G.nameFrom === "over" ? "over" : "ready";
  closeNameBox();
  G.state = back;
  Snd.sfx.click();

     until they go and crash again */

function closeNameBox() {

/* ------------------------- the 100,000m cutscene --------------------------- */
/* Six beats, driven off G.winT and stepped forward one window at a time.  The
   dino is positioned by hand on every frame of it: he is not simulated here,
   because a scripted arc that fights the physics for ten seconds is a scene
   that will break the first time somebody retunes gravity. */
const cineStep = () =>
  G.winT >= CFG.CIN_MODAL ? 6 : G.winT >= CFG.CIN_CROWN ? 5 : G.winT >= CFG.CIN_LAND ? 4
  : G.winT >= CFG.CIN_SIGNAL ? 3 : G.winT >= CFG.CIN_JUMP ? 2 : G.winT >= CFG.CIN_RUN ? 1 : 0;
/* where the antenna tip is: the tower parks centre-screen and its sprite's top
   row is the tip, so this is the only place that geometry is written down.
   It is the PARKED position, not the live one — the dino lands on a place that
   is choreographed, so the perch must not move if the tower is still rolling. */
const towerX = () => G.tower === null ? WW : G.tower;
const tipY = () => GROUND - 104;
const antennaX = () => CFG.TOWER_X + 20;
function winUpdate() {
  G.winT++;
  const c = G.cine, prev = c.step;
  c.step = cineStep();
  if (c.step !== prev) Snd.sfx.click();
  /* STEP 1 — arrival: the tower rolls in from the right and plants itself.
     Only during this beat: leaving it running for the whole ten seconds meant
     the perch he is scripted to land on depended on how long the scene had
     been playing, which is how a cutscene ends up not repeatable. */
  if (c.step === 1 && G.tower !== null && G.tower > CFG.TOWER_X) {
    G.tower = Math.max(CFG.TOWER_X, G.tower - 3.4);
    if (G.frame % 7 === 0) burst(G.tower + 20, GROUND - 100, 2, 1.4, 30, CYAN);
  }
  /* STEP 2 — flag jump: run to the mast, then a backflip onto the antenna */
  if (c.step === 2) {
    const run = G.winT - CFG.CIN_JUMP, k = clamp(run / 46, 0, 1);
    const perch = Math.round(antennaX() - 22);        /* his centre on the tip */
    P.x = Math.round(WW * 0.09 + (perch - WW * 0.09) * k);
    P.y = 0; P.vy = 0; P.flip = -1; P.spin = 0;
    if (run > 46) {
      /* A scripted arc, not the run's own jump: the tip is 104 units up and a
         normal jump tops out around 90.  Ease-out, not a sine, because a sine
         that starts at zero velocity looks like a lift; and it lands ON the
         tip rather than through it, which a parabola scaled by 3.2 did. */
      const j = clamp((run - 46) / 44, 0, 1);
      P.y = Math.round(104 * (1 - (1 - j) * (1 - j)));
      P.flip = j < 1 ? (j * 1.02) % 1 : -1;
      if (run === 50 || run === 64) Snd.sfx.djump();
      if (j >= 1) { P.y = 104; P.flip = -1; P.air = 1; P.x = perch; }
    }
  }
  /* STEP 3 — signal restore: the arcs fill 20 / 40 / 60 / 80 / 100, one chime
     each, timed off THIS beat and not the one before it */
  if (c.step === 3) {
    const want = Math.min(5, Math.floor((G.winT - CFG.CIN_SIGNAL) / 28));
    if (want > c.arc) { c.arc = want; c.sig = 26; Snd.sfx.point(); }
    if (c.sig > 0) c.sig--;
    P.y = 104; P.x = Math.round(antennaX() - 22); P.flip = -1;
  }
  /* STEP 4 — superhero landing: he drops off the mast and lands on one knee */
  if (c.step === 4) {
    const j = clamp((G.winT - CFG.CIN_LAND) / 42, 0, 1);
    P.x = Math.round(antennaX() - 22 - j * 70);
    P.y = Math.round(104 * (1 - j) * (1 - j));
    P.flip = -1;
    if (j > 0 && j < 1) { P.y = Math.max(0, P.y); P.air = 1; }
    if (j >= 1) {
      P.y = 0; P.air = 0;
      if (!c.dust) {                                   /* the dust cloud, once */
        c.dust = 1; c.dustT = G.parts.length;
        for (let i = 0; i < 22; i++)
          G.parts.push({ x: P.x + 20 + rnd(-26, 26), y: GROUND - rnd(0, 7),
                         vx: rnd(-2.6, -0.4), vy: rnd(-1.1, 0.2), life: ri(16, 30), sz: ri(1, 2),
                         col: mixHex(INK, PAPER, 0.45) });
        shake(4, 14); Snd.sfx.land();
      }
    }
  }
  /* STEP 5 — the victory outfit: crown down, shades on, cape out */
  if (c.step >= 5) {
    c.cape = Math.min(1, c.cape + 0.04);
    c.shades = Math.min(1, c.shades + 0.09);
  }
  /* STEP 6 — fireworks and confetti never stop */
  c.fireT++;
  if (c.fireT % 18 === 0) firework();
  if (c.fireT % 7 === 0) confetti(6);
}
/* ------------------------------- checkpoints ------------------------------- */
/* a checkpoint is a plain snapshot of the run in localStorage: die and you pick
   the journey back up from the last 10,000m mark instead of losing all of it. */
function writeCheckpoint() {
  save.cp = { m: G.meters, s: G.score, c: save.coins, a: G.ammo, d: Math.round(G.distance),
              b: G.bosses.slice(), n: G.nightPhase, r: G.revive, p: G.coinN, k: G.bossIdx,
              h: P.board > 0 ? 1 : 0, w: Math.round(G.beamCd) };

}
function clearCheckpoint() { if (save.cp) { save.cp = null; persist(); } }
const checkpointAt = () => (save.cp && save.cp.m > 0 ? save.cp.m : 0);
const fmtM = m => String(Math.floor(m)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
/* a fresh 100,000m run, or a pickup from the last banked checkpoint */
function resume() {
  const cp = save.cp;
  start();
  if (!cp || !cp.m) return;
  G.road = cp.m / CFG.M_PER_UNIT; G.meters = cp.m; G.distance = cp.d;
  G.score = cp.s; save.coins = cp.c; G.ammo = cp.a; G.coinN = cp.p;
  G.nightPhase = cp.n; setNight(cp.n % 2 === 1);

/* ------------------------- power-ups: hoverboard & spy ---------------------- */
/* Hoverboard: a stock you carry, deploy it with H or a double-tap.  While it is
   out the dino floats, jumps become kickflips, and the first crash costs the
   board instead of the run. */
function boardOn() { return P.board > 0; }
function deployBoard(auto) {
  if (G.state !== "run" || P.dead) return false;
  if (P.board > 0) {                                  /* already flying: stow it */
    P.board = 0; P.boardT = 0; P.sink = 12;          /* ease down off the hover height */
    P.spin = 0; P.air = 0; P.flip = -1; P.bob = 0; P.bobV = 0;
    save.boards = Math.min(99, save.boards + 1); persist();   /* putting it away keeps it */
    Snd.sfx.click(); return true;
  }
  if (save.boards <= 0) {
    if (auto) return false;
    toast("NO HOVERBOARD - BUY A PACK IN THE SHOP");
    Snd.sfx.deny(); return false;
  }
  save.boards--; P.board = 1; P.boardT = 0; P.sink = 0;
  P.bob = 0; P.bobV = -CFG.HOVER_HIT;               /* the deck drops in and settles */
  persist();

}
function loseBoard() {

/* Incognito: the spy hat makes you intangible for six seconds. */
function grantSpy() {
  P.spy = 1; P.spyT = spyMs(); P.spyMax = P.spyT; P.ghost = 0;
  Snd.sfx.spy(); G.flash = 18;

/* The deck's rest height this frame: the hover height, plus the idle sway of a
   board holding station, plus wherever its springs currently are.  Physics and
   rendering both read it, so the deck you see is always the deck you are on. */
const deckY = () => CFG.HOVER_H + Math.sin(G.frame / 11) * 1.6 + P.bob;
function updatePowerups(dt) {
  /* --- hoverboard: the deck rides a real spring-and-damper, and a kickflip is
     a real hop.  While the deck is in the air this branch owns P.y and P.vy
     outright, and the player physics below skips a flying dino, so the hop is
     integrated exactly once and nothing claws it back down on the launch. --- */
  if (P.board > 0) {
    const f = dt / 16.67;
    P.bob += P.bobV * f;                              /* travel, then react */
    P.bobV += (-CFG.HOVER_K * P.bob - CFG.HOVER_D * P.bobV) * f;
    const target = deckY();
    if (P.air > 0 || P.vy > 0 || P.y > target + 2) {
      P.vy -= CFG.GRAVITY;                         /* a kickflip falls like a jump */
      P.y += P.vy;
      if (P.y <= target && P.vy < 0) {             /* the deck catches the dino */
        P.y = target; P.vy = 0; P.air = 0; P.flip = -1; P.spin = 0;
        P.bobV = -CFG.HOVER_HIT;                   /* the springs take the landing */
        Snd.sfx.land(); puff(P.x + 20, GROUND - target, 4);
      }
    } else {
      P.y += (target - P.y) * 0.18;                /* ease up onto the cushion */
      P.vy = 0;
    }
    P.boardT += dt / 16.67;                        /* frames, like every other timer */
    if (G.frame % 5 === 0) Snd.sfx.hum(clamp((G.speed - CFG.SPEED) / (CFG.MAX_SPEED - CFG.SPEED), 0, 1));
    /* the spark trail under the deck */
    if (G.frame % 2 === 0) {
      const bx = P.x + 22, by = GROUND - 2;
      for (let i = 0; i < 3; i++) {
        G.parts.push({
          x: bx + rnd(20, -20), y: by + rnd(4, -2),
          vx: rnd(-2.4, -0.6), vy: rnd(0.5, -0.5),
          life: ri(8, 18), sz: ri(1, 2),
          col: pick([GOLD, GOLD, PALE]), soft: true
        });
      }
    }
  } else if (P.sink > 0) {
    /* easing down off the hover height after a stow; a real jump cancels it */
    P.sink -= dt / 16.67;
    if (P.vy > 0) P.sink = 0;
    else P.y = Math.max(0, P.y - 3 * dt / 16.67);
  }
  /* the kickflip is counted in frames: one full turn over HOVER_SPIN of them */
  if (P.spin > 0) P.spin = Math.max(0, P.spin - 1);
  /* --- incognito: run the clock, fade the ghost in and back out --- */
  if (P.spy > 0) {
    P.spyT -= dt;
    const left = P.spyT / (P.spyMax || CFG.SPY_MS);
    P.ghost = left > 0.9 ? (1 - left) / 0.1 : left < 0.18 ? left / 0.18 : 1;
    if (P.spyT <= 0) { P.spy = 0; P.spyT = 0; P.ghost = 0; toast("VISIBLE AGAIN"); }
  }
}

  if (d.id === "router") {                       /* hovering, red Wi-Fi pulses */
    b.x += clamp((d.home - b.x) * 0.02, -1.5, 1.5) - 0.3;
    b.y = d.y + Math.sin(b.t / 26) * 7;
    if (--b.fire <= 0) { b.fire = d.fire; fireWave(b, pick([GROUND - 100, GROUND - 66, GROUND - 32]), "wifi"); Snd.sfx.zap(); }
  } else if (d.id === "queen") {                 /* diving swoops and minion swarms */
    if (b.dive > 0) {
      b.dive--; b.x += b.vx; b.y += b.vy; b.vy += 0.14;
      if (b.x < -56 || b.y > GROUND - 26) { b.dive = 0; b.x = WW + 24; b.y = d.y; b.vx = 0; b.vy = 0; b.fire = 60; }
      return;
    }
    b.x = clamp(b.x + Math.sin(b.t / 38) * 1.2, 130, WW - d.w - 2);
    b.y = d.y + Math.sin(b.t / 15) * 26;
    if (b.phase > 0) b.phase--;
    if (--b.fire <= 0) {
      b.fire = d.fire;
      if (++b.n % 3 === 0) {                     /* minion swarm */
        for (let k = 0; k < 2; k++)
          G.waves.push({ x: b.x + 10, y: GROUND - 36 - k * 18, w: 12, h: 8, kind: "minion", dead: false, vx: -2.3, vy: 0 });
      } else {                                    /* a diving swoop, telegraphed */
        b.dive = 82; b.vx = -7.8; b.vy = 2.6; b.phase = 34;
      }
      Snd.sfx.zap();
    }
  } else if (d.id === "golem") {                 /* ground slam shockwaves */
    b.x += clamp((d.home - b.x) * 0.02, -1.2, 1.2) - 0.2;
    if (b.phase > 0) {
      b.phase--;
      b.y = d.y - Math.sin((1 - b.phase / 36) * Math.PI) * 11;
      if (b.phase === 0) {
        G.waves.push({ x: b.x - 6, y: GROUND - 17, w: 22, h: 17, kind: "shock", dead: false, vx: -3.4, vy: 0 });
        /* the second one waits behind the golem, then follows: every shockwave
           has to travel left, or it can never reach the dino */
        G.waves.push({ x: b.x + 62, y: GROUND - 17, w: 22, h: 17, kind: "shock", dead: false, vx: -3.4, vy: 0, hold: 20 });
        shake(4, 14); Snd.sfx.boom();
      }
      return;
    }
    b.y = d.y;
    if (--b.fire <= 0) { b.fire = d.fire; b.phase = 36; }
  } else if (d.id === "mecha") {                 /* laser blasts and fast dashes */
    if (b.dash > 0) {
      b.dash--; b.x += b.vx;
      if (b.x < 90 || b.x > WW - d.w - 2) { b.dash = 0; b.fire = 70; }
      return;
    }
    b.x = clamp(d.home + Math.sin(b.t / 30) * 72, 120, WW - 70);
    b.y = d.y + Math.sin(b.t / 22) * 5;
    if (--b.fire <= 0) {
      b.fire = d.fire;
      if (++b.n % 4 === 0) { b.dash = 48; b.vx = b.x > WW / 2 ? -13 : 13; Snd.sfx.zap(); }
      else fireWave(b, pick([GROUND - 46, GROUND - 20]), "laser");
    }
  } else if (d.id === "meteor") {                /* the last one is falling on you */
    b.x += clamp((d.home - b.x) * 0.03, -2, 2);
    b.y = 24 + 0.07 * b.t + 0.0003 * b.t * b.t;      /* a seven-second fall */
    if (G.frame % 3 === 0)
      G.parts.push({ x: b.x + rnd(34, 6), y: b.y + 10, vx: rnd(-1.5, -0.4), vy: rnd(-2.6, -0.9), life: ri(14, 28), sz: ri(1, 2), col: RED });
    if (b.y + d.h >= GROUND) { G.boss = null; gameOver("Burned away by the Extinction Meteor"); }
  }
}
function bossUpdate() {
  const b = G.boss;
  if (!b) return;
  b.t++;
  if (b.hurt > 0) b.hurt--;
  if (b.t > 45) bossBrain(b);
  for (let i = G.waves.length - 1; i >= 0; i--) {
    const w = G.waves[i];
    if (w.hold > 0) { w.hold--; continue; }         /* still winding up */
    w.x += w.vx; w.y += w.vy;
    if (w.dead) { w.vx += 0.12; w.y += w.vy; }
    if (w.x + w.w < -40 || w.x > WW + 60 || w.y > GROUND + 40 || w.y < -70) G.waves.splice(i, 1);
  }
  if (G.waves.length > 22) G.waves.splice(0, G.waves.length - 22);
  if (P.shield > 0) return;                       /* the golden shield eats one hit */
  if (phasing()) return;                          /* incognito: boss shots pass through */
  const db = dinoBoxes();
  for (let i = 0; i < G.waves.length; i++) {
    const w = G.waves[i], wb = [w.x, w.y, w.w, w.h];
    if (!w.dead && (hitBox(db[0], wb) || (db[1] && hitBox(db[1], wb)))) {
      /* the board is good for one hit from anything, boss included */
      if (flying()) { w.dead = true; w.vx = 2; w.vy = -3; loseBoard(); return; }
      gameOver(bossExcuse(b, w)); return;
    }
  }
}
function bossExcuse(b, w) {
  if (b.d.id === "golem" && w && w.kind === "shock") return "Crushed by a Glitch Golem shockwave";
  if (b.d.id === "mecha" && w && w.kind === "laser") return "Lasered by the Cyber Mecha-Rex";
  if (b.d.id === "queen") return "Snagged by the Pterodactyl Queen";
  if (b.d.id === "meteor") return "Burned away by the Extinction Meteor";
  return "Struck by a Wi-Fi energy pulse";
}

function jump() {
  if (G.state === "ready") { start(); return; }
  if (G.state === "win") { return; }                /* locked until the dialog */
  if (G.state === "over") { if (G.t > G.restartAt) resume(); return; }
  if (G.state === "pause") { G.state = "run"; Snd.start(); return; }
  if (G.state !== "run" || P.dead) return;
  if (P.grind) { P.grind = null; P.vy = jumpV() * 0.9; P.air = 1; Snd.sfx.djump(); return; }
  if (flying()) {
    /* on a board a jump is a 360 kickflip: a real hop, then a full spin.
       P.air counts the hops taken since the deck last caught the dino, which
       is a sturdier gate than the hover height — that bobs, so comparing
       P.y against it read the first tap as a double jump half the time. */
    if (P.air < 2) {
      const first = P.air === 0;
      P.air++;
      P.vy = first ? jumpV() : jumpV() * 0.88;
      P.flip = first ? -1 : 0;
      P.spin = CFG.HOVER_SPIN;
      if (first) { Snd.sfx.jump(); Snd.sfx.spin(); } else Snd.sfx.djump();
    }
    return;
  }
  if (P.y <= 0.01) { P.vy = jumpV(); P.air = 0; P.flip = -1; Snd.sfx.jump(); }
  else if (P.air < 1) {
    P.air++; P.vy = jumpV() * 0.88; P.flip = 0;
    burst(P.x + 20, GROUND - 43 - P.y + 40, 9, 2.2, 10); Snd.sfx.djump();
  }
}
/* the parry window: something close enough to swat, whichever button is down */
function parryThreat() {

  for (const o of G.obs) {
    if (o.dead || o.ridden) continue;
    if (o.x + o.w > P.x + 12 && o.x < P.x + 88 && o.y + o.h > top - 6 && o.y < top + 46) return o;
  }
  for (const w of G.waves) {
    if (w.dead || w.hold > 0) continue;
    if (w.x + w.w > P.x + 8 && w.x < P.x + 84 && w.y + w.h > top - 12 && w.y < top + 46) return w;
  }
  const b = G.boss;                                 /* parrying the boss itself */
  if (b && b.x + b.d.w > P.x + 10 && b.x < P.x + 96 && b.y + b.d.h > top - 10 && b.y < top + 48) return b;
  return null;

function parry(o) {

    if (b) bossHit(1, o.x + 8, o.y + 4);            /* deflecting its own shot hurts it */
  }
  G.bonus += 50; G.flash = 16; shake(3, 10); Snd.sfx.parry();
  toast("PARRY!");
  bumpCombo(1);
  /* the shockwave launches the dino upward into a backflip */
  P.vy = jumpV() * 1.12; P.y = Math.max(P.y, 1.5); P.air = 1; P.flip = 0;
  Snd.sfx.djump();

/* One place for the "a control was pressed" state machine: every in-run button
   routes through here, so start / restart / unpause behave the same everywhere. */
function runInput() {
  if (G.state === "ready") { start(); return false; }
  if (G.state === "win") { return false; }          /* the cutscene owns the dino */
  if (G.state === "over") { if (G.t > G.restartAt) resume(); return false; }
  if (G.state === "pause") { G.state = "run"; Snd.start(); return false; }
  return G.state === "run" && !P.dead;
}
/* Enter / J / → stay context sensitive so the keyboard keeps its one-button
   feel: swat what is in range, otherwise spend a rocket. */
function action() {
  if (!runInput()) return;
  const threat = parryThreat();
  if (threat) { parry(threat); return; }
  rocket();
}
/* PARRY: a timed shockwave.  Double-tap it for the Laser Roar. */
function parryPress() {
  if (!runInput()) return;
  if (G.lastParry >= 0 && G.t - G.lastParry < 320) { G.lastParry = -1; laserRoar(); return; }
  G.lastParry = G.t;
  const threat = parryThreat();
  if (threat) { parry(threat); return; }
  Snd.sfx.deny();                                   /* nothing close enough to swat */
}
/* ROCKET: a high-speed missile, gated on ammo. */
function rocket() {
  if (!runInput()) return;
  /* one "fire" control, two tools: while the belt is loaded the button throws
     a pistol round, and once the belt runs dry the same button throws the
     missile.  That keeps the six-button bar exactly six buttons long — the
     pistol was the obvious thing to want a seventh button for, and a bar that
     reflows is a bar whose hit targets move. */
  if (P.gun > 0) { pistol(); return; }
  if (G.ammo <= 0) { Snd.sfx.deny(); return; }     /* out of rockets */
  if (G.cool > 0) return;
  G.ammo--; G.cool = 0.25;
  /* the shot remembers whether the board fired it: a missile leaving the deck
     rakes the road below it instead of sailing over every short cactus */
  G.shots.push({ x: P.x + 30, y: GROUND - 43 - P.y + 11, board: flying() });
  Snd.sfx.shoot();
}
/* ------------------------------ the pistol -------------------------------- */
/* A track pickup rather than a permanent upgrade: an ammo crate, spent one
   round at a time.  It exists because the rocket is the wrong tool for a
   cactus — a missile takes a rocket away, blows a hole in the road and throws
   25 points at something you could have shot standing still.  The pistol is
   cheap, quiet and plentiful, which is exactly what the first 10,000m wants,
   so the crate spawns before a belt is ever empty and never while it is full. */
function giveGun(n) {
  P.gun = Math.min(CFG.GUN_MAX, P.gun + n);
  toast(n === CFG.GUN_AMMO ? "PISTOL +" + n + "  (ROCKET BUTTON)" : "PISTOL RELOADED");
  persist();
}
function pistol() {
  if (!runInput()) return;
  if (P.gun <= 0) { Snd.sfx.deny(); return; }      /* empty chamber */
  if (P.gunCd > 0) return;                         /* too fast to spam */
  P.gun--; P.gunCd = CFG.GUN_CD; P.gunFlash = 3;
  /* the shot leaves the muzzle, not the hip: from the hand, so it clears a
     short cactus at ground level the way the rocket's arc never does */
  const ay = P.duck ? GROUND - 15 - P.y : GROUND - 24 - P.y;
  G.shots.push({ x: P.x + 30, y: ay, gun: true, r: 1 });

/* --------------------------- combo & Laser Roar --------------------------- */
/* Every kill chains the combo; five in a row (or the R key / a double-tapped
   PARRY) fire the Roar: a split-second pause, a growl, then a screen-wide beam
   that vaporizes every cactus and bird on screen into sparks. */
function bumpCombo(n) {
  G.combo += n; G.comboT = CFG.COMBO_MS;
  if (G.combo > 0 && G.combo % CFG.COMBO_HIT === 0) laserRoar(true);
}
/* The roar is a limited weapon, not a button you can lean on: the manual
   triggers (R, or a double-tapped PARRY) have to recharge for LASER_CD, and a
   hot gun says so instead of firing.  A five-kill combo is a reward, so it is
   allowed to spend a charge that is still warm — but it still re-arms the
   clock, so even the combo cannot machine-gun the screen. */
function laserRoar(auto) {
  if (G.state !== "run" || P.dead || G.beamT > 0) return;
  if (!auto && G.beamCd > 0) {
    toast("LASER RECHARGING " + (G.beamCd / 1000).toFixed(1) + "s");
    Snd.sfx.deny();
    return;
  }
  G.beamT = CFG.LASER_MS;
  G.beamCd = recharge(CFG.LASER_CD);
  G.beamY = GROUND - 43 - P.y + 13;
  G.flash = 26; shake(5, 18); Snd.sfx.roar();
  let n = 0;
  for (const o of G.obs) {
    if (o.dead || o.ridden) continue;
    o.dead = true; o.vx = 1.6; o.vy = -3.2; n++;
    burst(o.x + o.w / 2, o.y + o.h / 2, 16, 3, 22, CYAN);
    G.bonus += 10;
  }
  G.combo = 0; G.comboT = 0;
  toast(n ? "LASER ROAR!  x" + n : "LASER ROAR!");
}
/* --------------------------- the grappling hook ---------------------------- */
/* Fire a rope up to the nearest cloud or pterodactyl and swing through the air
   for three seconds, safely over the ground hazards, then detach with a NICE!. */
function hookTarget() {
  let best = null, bd = 1e9;
  const consider = (x, y, ref, cloud) => {
    if (x < P.x + 10 || x > WW - 6 || y > GROUND - 36 || y < 6) return;
    const d = (x - P.x) + Math.abs(y - (GROUND - 43 - P.y)) * 0.35;
    if (d < bd) { bd = d; best = { x, y, ref, cloud }; }
  };
  for (const o of G.obs) if (o.fly && !o.dead) consider(o.x + 12, o.y + 6, o, false);
  for (const c of G.clouds) consider(c.x + 20, c.y + 8, null, true);
  return best;
}
function hook() {
  if (!runInput()) return;
  if (P.hookT > 0) return;
  if (flying()) { Snd.sfx.deny(); return; }        /* stow the board first */
  const t = hookTarget();
  if (!t) { toast("NO ANCHOR - FIND A CLOUD OR PTERODACTYL"); Snd.sfx.deny(); return; }
  P.hook = t; P.hookT = CFG.HOOK_MS;
  P.vy = 0; P.air = 0; P.flip = -1; P.grind = null; P.sink = 0;
  /* the rope never breaks the chain: the window drains while you swing, so the
     HUD bar is honest, but the tick spares G.combo mid-swing and the detach
     below refills the window — a grapple over a cactus lands you still holding
     the chain instead of punishing you for using the hook. */
  Snd.sfx.hook();
  toast("GRAPPLE!");
}
function updateHook(dt) {
  if (P.hookT <= 0) return;
  if (P.hook) {
    /* ride the anchor: a live bird moves with the world, a cloud just drifts */
    if (P.hook.ref && !P.hook.ref.dead) { P.hook.x = P.hook.ref.x + 12; P.hook.y = P.hook.ref.y + 6; }
    else P.hook.x -= G.spd;
    if (P.hook.x < -40) P.hookT = 0;
  }
  P.hookT -= dt;
  /* a smooth pendulum: rise to the top of the arc, then settle back down */
  const k = clamp(1 - Math.max(0, P.hookT) / CFG.HOOK_MS, 0, 1);
  P.y = CFG.HOOK_ARC * Math.sin(k * Math.PI) + CFG.HOVER_H * 0.4;
  P.vy = 0; P.air = 1; P.duck = false;
  if (G.frame % 6 === 0)
    G.parts.push({ x: P.x + 22, y: GROUND - P.y, vx: rnd(-1.6, -0.4), vy: rnd(-1, 0.3), life: 14, sz: 1, col: CYAN, soft: true });
  if (P.hookT <= 0) {
    P.hookT = 0; P.hook = null;
    P.vy = jumpV() * 0.45; P.air = 1;
    /* top the window back up on the way down: whatever the swing drained, you
       land holding the same chain, so the rope can never break it */
    if (G.combo > 0) G.comboT = CFG.COMBO_MS;
    G.bonus += CFG.HOOK_PTS;
    toast("NICE!");
    Snd.sfx.point();
  }
}

const KEYS = {
  Space: "jump", KeyW: "jump", ArrowUp: "jump", KeyK: "jump",
  ArrowDown: "slide", KeyS: "slide", KeyA: "slide",
  KeyF: "rocket", KeyC: "parry", Enter: "action", KeyJ: "action", ArrowRight: "action",
  ShiftLeft: "slow", ShiftRight: "slow",
  KeyH: "board", KeyG: "hook", KeyR: "laser", KeyX: "pistol",
  KeyP: "pause", Escape: "pause", KeyM: "mute"
};
window.addEventListener("keydown", e => {
  if (G.state === "name") {                            /* the tag panel owns the keyboard */
    /* The field itself is a real input and eats printable keys on its own, so
       this handler must only take the keys the input cannot: commit, dismiss,
       and STOP, so a player who does not want a tag is never trapped here. */
    if (e.code === "Enter") { e.preventDefault(); commitName(true); return; }
    /* the soft keyboard's BACK key arrives here, so this commits what was typed
       rather than throwing it away — see commitName() */
    if (e.code === "Escape") { e.preventDefault(); commitName(true); return; }
    return;
  }
  if (G.state === "board") {                           /* the global board owns the keyboard */
    e.preventDefault();
    if (e.code === "Escape" || e.code === "KeyP" || e.code === "Enter" || e.code === "Space") closeBoard();
    else if (e.code === "KeyR") { lbFetch(); Snd.sfx.click(); }
    return;
  }
  if (G.state === "pro") {                             /* the VIP modal owns the keyboard */
    e.preventDefault();
    if (e.code === "Escape" || e.code === "KeyP") closePro();
    else if (e.code === "Space" || e.code === "Enter" || e.code === "KeyF") activatePro();
    return;
  }
  if (G.state === "shop") {                            /* the shop owns the keyboard */
    e.preventDefault();
    if (e.code === "Escape" || e.code === "KeyP") closeShop();
    /* the shop is a grid: up/down step a row, left/right step a column, and
       down off the last row lands on the full-width hoverboard pack */
    else if (e.code === "ArrowDown" || e.code === "KeyS") { G.shopSel = Math.min(SKINS.length, G.shopSel + SHOP_COLS); Snd.sfx.click(); }
    else if (e.code === "ArrowUp" || e.code === "KeyW") { G.shopSel = Math.max(0, G.shopSel - SHOP_COLS); Snd.sfx.click(); }
    else if (e.code === "ArrowRight" || e.code === "KeyD") { G.shopSel = Math.min(SKINS.length - 1, G.shopSel + 1); Snd.sfx.click(); }
    else if (e.code === "ArrowLeft" || e.code === "KeyA") { G.shopSel = Math.max(0, G.shopSel - 1); Snd.sfx.click(); }
    else if (e.code === "Space" || e.code === "Enter" || e.code === "KeyF") {
      if (G.shopSel >= SKINS.length + 1) closeShop(); else shopPick(G.shopSel);
    }
    return;
  }
  const a = KEYS[e.code];
  if (!a) return;
  e.preventDefault();
  if (e.repeat) return;
  Snd.init(); Snd.resume();
  if (a === "jump") jump();
  else if (a === "slide") held.keySlide = true;
  else if (a === "action") action();
  else if (a === "rocket") rocket();
  else if (a === "pistol") pistol();
  else if (a === "parry") parryPress();
  else if (a === "hook") hook();
  else if (a === "laser") laserRoar();
  else if (a === "slow") slowMo();
  else if (a === "board") deployBoard(false);
  else if (a === "pause") togglePause();
  else if (a === "mute") toggleSound();
}, { passive: false });
window.addEventListener("keyup", e => { if (KEYS[e.code] === "slide") held.keySlide = false; });
window.addEventListener("blur", () => { held.keySlide = false; held.padSlide = false; });

/* ---------------------------- on-screen gamepad ---------------------------- */
function bindButton(id, on, off) {

  const up = () => { el.classList.remove("on"); if (off) off(); };

  el.addEventListener("pointerup", up);

bindButton("bGrind", slidePress, slideRelease);

bindButton("bParry", parryPress);
bindButton("bRocket", rocket);
