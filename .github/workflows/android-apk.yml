# Capacitor Android debug APK build
name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('android-app/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install wrapper npm deps
        working-directory: android-app
        run: npm ci

      - name: Sync web assets into Android
        working-directory: android-app
        run: npx cap sync android

      # capacitor.build.gradle pins sourceCompatibility/targetCompatibility to
      # Java 21, so JDK 17 would fail with "invalid source release: 21".
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel-dino-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
