<style>
  :root { color-scheme: light; --paper:#ffffff; --ink:#535353; --soft:#8f8f8f; --hair:#dcdcdc; --pad:rgba(255,255,255,.76); }
  :root.night { color-scheme: dark; --paper:#0e0e0e; --ink:#ededed; --soft:#8a8a8a; --hair:#3a3a3a; --pad:rgba(14,14,14,.72); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--paper); color: var(--ink);
    font-family: "Courier New", Courier, monospace;
    overflow: hidden; overscroll-behavior: none;
    touch-action: none; user-select: none; -webkit-user-select: none;
    transition: background-color .3s ease, color .3s ease;
  }
  #wrap {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #shell { position: relative; overflow: hidden; background: var(--paper); transition: background-color .3s ease; box-shadow: 0 0 0 1px var(--hair); }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }

  /* the chips ride on the game itself, not on the page */
  #topbar { position: absolute; top: max(5px, 1.1vmin); right: max(6px, 1.4vmin); display: flex; gap: min(7px, .9vmin); z-index: 3; }
  .chip {
    font: 700 clamp(9px, calc(var(--u, 300px) * .040), 13px)/1 "Courier New", Courier, monospace; letter-spacing: .07em;
    color: var(--soft); background: var(--paper); border: 1px solid var(--hair); border-radius: 999px;
    padding: clamp(4px, calc(var(--u, 300px) * .022), 7px) clamp(7px, calc(var(--u, 300px) * .034), 12px);
    cursor: pointer; touch-action: manipulation;
    transition: background-color .3s ease, color .3s ease, border-color .3s ease;
  }
  .chip:active { color: var(--ink); border-color: var(--soft); }
  .chip.off { opacity: .4; }
  .chip[hidden] { display: none; }
  /* the install chip only exists once the browser says the app is installable */
  #bInstall { border-color: #2aa9b8; color: #1d7f8b; }
  :root.night #bInstall { border-color: #57dfec; color: #57dfec; }

  /* A single responsive bar pinned to the bottom of the game box: six equal
     buttons that live in the empty strip below the ground line, so they never
     cover the road. Every size is a fraction of --u (the on-screen game
     height), so the bar scales with the canvas instead of drifting off it. */
  #pad {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: calc(var(--u, 300px) * .155);
    display: none; align-items: stretch; gap: calc(var(--u, 300px) * .011);
    padding: calc(var(--u, 300px) * .013); pointer-events: none; z-index: 2;
  }
  body.touch #pad { display: flex; }
  /* a modal owns the screen: get the buttons out from under it */
  body.modal #pad { opacity: 0; pointer-events: none; }
  body.modal #pad .btn { pointer-events: none; }
  #pad, .btn { transition: opacity .16s ease, background-color .3s ease, color .3s ease, border-color .3s ease, transform .07s ease; }
  .btn {
    position: relative; flex: 1 1 0; min-width: 0; pointer-events: auto;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font: 700 clamp(8px, calc(var(--u, 300px) * .024), 13px)/1.02 "Courier New", Courier, monospace; letter-spacing: .02em;
    color: var(--ink); background: var(--pad);
    border: 2px solid var(--ink); border-radius: 999px;
    touch-action: none; -webkit-user-select: none; user-select: none;
    white-space: nowrap; overflow: hidden;
  }
  .btn.on { background: var(--ink); color: var(--paper); transform: scale(.94); }
  .btn.dim { opacity: .38; }
  /* JUMP is the one control you cannot play without, so it is the widest key on
     the bar and the only one whose face is already filled. */
  #bJump { flex: 1.9 1 0; border-width: 3px; background: var(--ink); color: var(--paper); font-size: clamp(9px, calc(var(--u, 300px) * .027), 14px); }
  #bJump.on { background: var(--paper); color: var(--ink); }
  #bPro {
    border-color: #d9a520; color: #a87a10; background: #fffaea;
    box-shadow: 0 0 0 1px rgba(217,165,32,.3), 0 0 12px rgba(217,165,32,.45);
    animation: proGlow 1.7s ease-in-out infinite;
  }
  :root.night #bPro { color: #e3ba4c; border-color: #8a6a1c; background: #221b09; }
  #bPro.active { animation: none; color: #fff6d8; border-color: #d9a520; background: #6b4f0d; }
  @keyframes proGlow {
    0%, 100% { box-shadow: 0 0 0 1px rgba(217,165,32,.28), 0 0 8px rgba(217,165,32,.35); }
    50%      { box-shadow: 0 0 0 1px rgba(217,165,32,.6),  0 0 20px rgba(217,165,32,.8); }

"use strict";
/* ============================================================================
   DINO.EXE — "Buffering Run"
   A single-file parody of the Chrome offline T-Rex runner.

   - Sprite art is the real thing: rect tables traced 1:1 from the official
     Chromium offline sprite sheet (T-Rex 44x47, ducking 55x25, cacti, cloud,
     pterodactyl).
   - Physics follows Chrome's own numbers: jump velocity 10 + speed/10, gravity
     0.6 per 60Hz frame, and a deliberately unhurried speed curve — a 4.4 walk
     held for the first 10,500m, then a smoothstep up to 9.6 by the tower.
   - Touch: a responsive six-button bar below the road (↓ GRIND, SLOW, PARRY,
     ROCKET, HOOK, RIDE), jumping on a tap of the field, plus swipe up / swipe
     down.  The run is a 100,000m journey with five boss gates, a checkpoint
     every 10,000m and a tower at the finish line.
   Pure white paper, a single #535353 ink, no libraries, no build step.  The
   page also ships a manifest and a service worker, so the same file installs
   as an app and can be wrapped into an Android APK (see ANDROID.md).
   ========================================================================== */

   the two palettes are cross-faded per frame so the sky change is smooth.  */

/* Chrome's own incognito grey, #202124, with the dino drawn in near-white */

let PAPER = DAYC.paper, INK = DAYC.ink, SOFT = DAYC.soft, FAINT = DAYC.faint,
    PEBBLE = DAYC.pebble, CLOUD = DAYC.cloud, STAR = DAYC.star,
    GOLD = DAYC.gold, CYAN = DAYC.cyan, RED = DAYC.red, PALE = DAYC.pale;
/* 0 = the scene ink, 1 gold, 2 cyan, 3 red, 4 paper, 5 pale gold.  Skin
   accessories pick from this so a hat, a visor and a crown can be coloured
   while the dino itself stays exactly the Chrome sprite. */
const ACCENT = [null, DAYC.gold, DAYC.cyan, DAYC.red, DAYC.paper, DAYC.pale];
function mixHex(a, b, t) {
  if (t <= 0) return a;
  if (t >= 1) return b;
  const p = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  const A = p(a), B = p(b), h = v => Math.round(v).toString(16).padStart(2, "0");
  return "#" + h(A[0] + (B[0] - A[0]) * t) + h(A[1] + (B[1] - A[1]) * t) + h(A[2] + (B[2] - A[2]) * t);
}
function applyNight(t) {
  /* incognito overrides the sky entirely: Chrome's dark grey, whatever the hour */
  const on = P.spy > 0;
  const pick2 = k => on ? INCOG[k] : mixHex(DAYC[k], NIGHTC[k], t);
  PAPER = pick2("paper"); INK = pick2("ink"); SOFT = pick2("soft"); FAINT = pick2("faint");
  PEBBLE = pick2("pebble"); CLOUD = pick2("cloud"); STAR = pick2("star");
  GOLD = mixHex(DAYC.gold, NIGHTC.gold, t);
  CYAN = mixHex(DAYC.cyan, NIGHTC.cyan, t);
  RED = mixHex(DAYC.red, NIGHTC.red, t);
  PALE = mixHex(DAYC.pale, NIGHTC.pale, t);
  ACCENT[1] = GOLD; ACCENT[2] = CYAN; ACCENT[3] = RED; ACCENT[4] = PAPER; ACCENT[5] = PALE;
}

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a = 1, b = 0) => b + Math.random() * (a - b);
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[(Math.random() * a.length) | 0];

const deckY = () => CFG.HOVER_H + Math.sin(G.frame / 11) * 1.6 + P.bob;
function updatePowerups(dt) {
  /* --- hoverboard: the deck rides a real spring-and-damper, and a kickflip is
     a real hop.  While the deck is in the air this branch owns P.y and P.vy
     outright, and the player physics below skips a flying dino, so the hop is
     integrated exactly once and nothing claws it back down on the launch. --- */
  if (P.board > 0) {
    const f = dt / 16.67;
    P.bob += P.bobV * f;                              /* travel, then react */
    P.bobV += (-CFG.HOVER_K * P.bob - CFG.HOVER_D * P.bobV) * f;
    const target = deckY();
    if (P.air > 0 || P.vy > 0 || P.y > target + 2) {
      P.vy -= CFG.GRAVITY;                         /* a kickflip falls like a jump */
      P.y += P.vy;
      if (P.y <= target && P.vy < 0) {             /* the deck catches the dino */
        P.y = target; P.vy = 0; P.air = 0; P.flip = -1; P.spin = 0;
        P.bobV = -CFG.HOVER_HIT;                   /* the springs take the landing */
        Snd.sfx.land(); puff(P.x + 20, GROUND - target, 4);
      }
    } else {
      P.y += (target - P.y) * 0.18;                /* ease up onto the cushion */
      P.vy = 0;
    }
    P.boardT += dt / 16.67;                        /* frames, like every other timer */
    if (G.frame % 5 === 0) Snd.sfx.hum(clamp((G.speed - CFG.SPEED) / (CFG.MAX_SPEED - CFG.SPEED), 0, 1));
    /* the spark trail under the deck */
    if (G.frame % 2 === 0) {
      const bx = P.x + 22, by = GROUND - 2;
      for (let i = 0; i < 3; i++) {
        G.parts.push({
          x: bx + rnd(20, -20), y: by + rnd(4, -2),
          vx: rnd(-2.4, -0.6), vy: rnd(0.5, -0.5),
          life: ri(8, 18), sz: ri(1, 2),
          col: pick([GOLD, GOLD, PALE]), soft: true
        });
      }
    }
  } else if (P.sink > 0) {
    /* easing down off the hover height after a stow; a real jump cancels it */
    P.sink -= dt / 16.67;
    if (P.vy > 0) P.sink = 0;
    else P.y = Math.max(0, P.y - 3 * dt / 16.67);
  }
  /* the kickflip is counted in frames: one full turn over HOVER_SPIN of them */
  if (P.spin > 0) P.spin = Math.max(0, P.spin - 1);

  if (P.spy > 0) {

    if (P.spyT <= 0) { P.spy = 0; P.spyT = 0; P.ghost = 0; toast("VISIBLE AGAIN"); }
  }
}

    if (--b.fire <= 0) { b.fire = d.fire; fireWave(b, pick([GROUND - 100, GROUND - 66, GROUND - 32]), "wifi"); Snd.sfx.zap(); }
  } else if (d.id === "queen") {                 /* diving swoops and minion swarms */
    if (b.dive > 0) {
      b.dive--; b.x += b.vx; b.y += b.vy; b.vy += 0.14;
      if (b.x < -56 || b.y > GROUND - 26) { b.dive = 0; b.x = WW + 24; b.y = d.y; b.vx = 0; b.vy = 0; b.fire = 60; }
      return;
    }
    b.x = clamp(b.x + Math.sin(b.t / 38) * 1.2, 130, WW - d.w - 2);
    b.y = d.y + Math.sin(b.t / 15) * 26;
    if (b.phase > 0) b.phase--;
    if (--b.fire <= 0) {
      b.fire = d.fire;
      if (++b.n % 3 === 0) {                     /* minion swarm */
        for (let k = 0; k < 2; k++)
          G.waves.push({ x: b.x + 10, y: GROUND - 36 - k * 18, w: 12, h: 8, kind: "minion", dead: false, vx: -2.3, vy: 0 });
      } else {                                    /* a diving swoop, telegraphed */
        b.dive = 82; b.vx = -7.8; b.vy = 2.6; b.phase = 34;
      }
      Snd.sfx.zap();
    }
  } else if (d.id === "golem") {                 /* ground slam shockwaves */
    b.x += clamp((d.home - b.x) * 0.02, -1.2, 1.2) - 0.2;
    if (b.phase > 0) {
      b.phase--;
      b.y = d.y - Math.sin((1 - b.phase / 36) * Math.PI) * 11;
      if (b.phase === 0) {
        G.waves.push({ x: b.x - 6, y: GROUND - 17, w: 22, h: 17, kind: "shock", dead: false, vx: -3.4, vy: 0 });
        /* the second one waits behind the golem, then follows: every shockwave
           has to travel left, or it can never reach the dino */
        G.waves.push({ x: b.x + 62, y: GROUND - 17, w: 22, h: 17, kind: "shock", dead: false, vx: -3.4, vy: 0, hold: 20 });
        shake(4, 14); Snd.sfx.boom();
      }
      return;
    }
    b.y = d.y;
    if (--b.fire <= 0) { b.fire = d.fire; b.phase = 36; }
  } else if (d.id === "mecha") {                 /* laser blasts and fast dashes */
    if (b.dash > 0) {
      b.dash--; b.x += b.vx;
      if (b.x < 90 || b.x > WW - d.w - 2) { b.dash = 0; b.fire = 70; }
      return;
    }
    b.x = clamp(d.home + Math.sin(b.t / 30) * 72, 120, WW - 70);
    b.y = d.y + Math.sin(b.t / 22) * 5;
    if (--b.fire <= 0) {
      b.fire = d.fire;
      if (++b.n % 4 === 0) { b.dash = 48; b.vx = b.x > WW / 2 ? -13 : 13; Snd.sfx.zap(); }
      else fireWave(b, pick([GROUND - 46, GROUND - 20]), "laser");
    }
  } else if (d.id === "meteor") {                /* the last one is falling on you */
    b.x += clamp((d.home - b.x) * 0.03, -2, 2);
    b.y = 24 + 0.07 * b.t + 0.0003 * b.t * b.t;      /* a seven-second fall */
    if (G.frame % 3 === 0)
      G.parts.push({ x: b.x + rnd(34, 6), y: b.y + 10, vx: rnd(-1.5, -0.4), vy: rnd(-2.6, -0.9), life: ri(14, 28), sz: ri(1, 2), col: RED });
    if (b.y + d.h >= GROUND) { G.boss = null; gameOver("Burned away by the Extinction Meteor"); }
  }
}
function bossUpdate() {
  const b = G.boss;
  if (!b) return;
  b.t++;
  if (b.hurt > 0) b.hurt--;
  if (b.t > 45) bossBrain(b);
  for (let i = G.waves.length - 1; i >= 0; i--) {
    const w = G.waves[i];
    if (w.hold > 0) { w.hold--; continue; }         /* still winding up */
    w.x += w.vx; w.y += w.vy;
    if (w.dead) { w.vx += 0.12; w.y += w.vy; }
    if (w.x + w.w < -40 || w.x > WW + 60 || w.y > GROUND + 40 || w.y < -70) G.waves.splice(i, 1);
  }
  if (G.waves.length > 22) G.waves.splice(0, G.waves.length - 22);
  if (P.shield > 0) return;                       /* the golden shield eats one hit */
  if (phasing()) return;                          /* incognito: boss shots pass through */
  const db = dinoBoxes();
  for (let i = 0; i < G.waves.length; i++) {
    const w = G.waves[i], wb = [w.x, w.y, w.w, w.h];
    if (!w.dead && (hitBox(db[0], wb) || (db[1] && hitBox(db[1], wb)))) {
      /* the board is good for one hit from anything, boss included */
      if (flying()) { w.dead = true; w.vx = 2; w.vy = -3; loseBoard(); return; }
      gameOver(bossExcuse(b, w)); return;
    }
  }
}
function bossExcuse(b, w) {
  if (b.d.id === "golem" && w && w.kind === "shock") return "Crushed by a Glitch Golem shockwave";
  if (b.d.id === "mecha" && w && w.kind === "laser") return "Lasered by the Cyber Mecha-Rex";
  if (b.d.id === "queen") return "Snagged by the Pterodactyl Queen";
  if (b.d.id === "meteor") return "Burned away by the Extinction Meteor";
  return "Struck by a Wi-Fi energy pulse";
}

function jump() {
  if (G.state === "ready") { start(); return; }
  if (G.state === "win") { if (G.t > G.restartAt) { clearCheckpoint(); start(); } return; }
  if (G.state === "over") { if (G.t > G.restartAt) resume(); return; }
  if (G.state === "pause") { G.state = "run"; Snd.start(); return; }
  if (G.state !== "run" || P.dead) return;
  if (P.grind) { P.grind = null; P.vy = jumpV() * 0.9; P.air = 1; Snd.sfx.djump(); return; }
  if (flying()) {
    /* on a board a jump is a 360 kickflip: a real hop, then a full spin.
       P.air counts the hops taken since the deck last caught the dino, which
       is a sturdier gate than the hover height — that bobs, so comparing
       P.y against it read the first tap as a double jump half the time. */
    if (P.air < 2) {
      const first = P.air === 0;
      P.air++;
      P.vy = first ? jumpV() : jumpV() * 0.88;
      P.flip = first ? -1 : 0;
      P.spin = CFG.HOVER_SPIN;
      if (first) { Snd.sfx.jump(); Snd.sfx.spin(); } else Snd.sfx.djump();
    }
    return;
  }
  if (P.y <= 0.01) { P.vy = jumpV(); P.air = 0; P.flip = -1; Snd.sfx.jump(); }
  else if (P.air < 1) {
    P.air++; P.vy = jumpV() * 0.88; P.flip = 0;
    burst(P.x + 20, GROUND - 43 - P.y + 40, 9, 2.2, 10); Snd.sfx.djump();
  }
}
/* the parry window: something close enough to swat, whichever button is down */
function parryThreat() {
  const top = GROUND - 43 - P.y;
  for (const o of G.obs) {
    if (o.dead || o.ridden) continue;
    if (o.x + o.w > P.x + 12 && o.x < P.x + 88 && o.y + o.h > top - 6 && o.y < top + 46) return o;
  }
  for (const w of G.waves) {
    if (w.dead || w.hold > 0) continue;
    if (w.x + w.w > P.x + 8 && w.x < P.x + 84 && w.y + w.h > top - 12 && w.y < top + 46) return w;
  }
  const b = G.boss;                                 /* parrying the boss itself */
  if (b && b.x + b.d.w > P.x + 10 && b.x < P.x + 96 && b.y + b.d.h > top - 10 && b.y < top + 48) return b;
  return null;
}
function parry(o) {
  const b = G.boss;
  if (o === b) {                                    /* a parry chips a boss twice */
    bossHit(2, o.x + o.d.w / 2, o.y + o.d.h / 2);
    burst(o.x + o.d.w / 2, o.y + o.d.h / 2, 18, 3.4, 26, CYAN);
  } else {
    o.dead = true; o.vx = 1.4; o.vy = -5.5;
    burst(o.x + (o.w || 18) / 2, o.y + 6, 16, 3.2, 26, CYAN);
    if (b) bossHit(1, o.x + 8, o.y + 4);            /* deflecting its own shot hurts it */
  }
  G.bonus += 50; G.flash = 16; shake(3, 10); Snd.sfx.parry();
  toast("PARRY!");
  bumpCombo(1);
  /* the shockwave launches the dino upward into a backflip */
  P.vy = jumpV() * 1.12; P.y = Math.max(P.y, 1.5); P.air = 1; P.flip = 0;
  Snd.sfx.djump();
}
/* One place for the "a control was pressed" state machine: every in-run button
   routes through here, so start / restart / unpause behave the same everywhere. */
function runInput() {
  if (G.state === "ready") { start(); return false; }
  if (G.state === "win") { if (G.t > G.restartAt) { clearCheckpoint(); start(); } return false; }
  if (G.state === "over") { if (G.t > G.restartAt) resume(); return false; }
  if (G.state === "pause") { G.state = "run"; Snd.start(); return false; }
  return G.state === "run" && !P.dead;
}
/* Enter / J / → stay context sensitive so the keyboard keeps its one-button
   feel: swat what is in range, otherwise spend a rocket. */
function action() {
  if (!runInput()) return;
  const threat = parryThreat();
  if (threat) { parry(threat); return; }
  rocket();
}
/* PARRY: a timed shockwave.  Double-tap it for the Laser Roar. */
function parryPress() {
  if (!runInput()) return;
  if (G.lastParry >= 0 && G.t - G.lastParry < 320) { G.lastParry = -1; laserRoar(); return; }
  G.lastParry = G.t;
  const threat = parryThreat();
  if (threat) { parry(threat); return; }
  Snd.sfx.deny();                                   /* nothing close enough to swat */
}
/* ROCKET: a high-speed missile, gated on ammo. */
function rocket() {
  if (!runInput()) return;
  if (G.ammo <= 0) { Snd.sfx.deny(); return; }     /* out of rockets */
  if (G.cool > 0) return;
  G.ammo--; G.cool = 0.25;
  /* the shot remembers whether the board fired it: a missile leaving the deck
     rakes the road below it instead of sailing over every short cactus */
  G.shots.push({ x: P.x + 30, y: GROUND - 43 - P.y + 11, board: flying() });
  Snd.sfx.shoot();
}
/* --------------------------- combo & Laser Roar --------------------------- */
/* Every kill chains the combo; five in a row (or the R key / a double-tapped
   PARRY) fire the Roar: a split-second pause, a growl, then a screen-wide beam
   that vaporizes every cactus and bird on screen into sparks. */
function bumpCombo(n) {
  G.combo += n; G.comboT = CFG.COMBO_MS;
  if (G.combo > 0 && G.combo % CFG.COMBO_HIT === 0) laserRoar(true);
}
/* The roar is a limited weapon, not a button you can lean on: the manual
   triggers (R, or a double-tapped PARRY) have to recharge for LASER_CD, and a
   hot gun says so instead of firing.  A five-kill combo is a reward, so it is
   allowed to spend a charge that is still warm — but it still re-arms the
   clock, so even the combo cannot machine-gun the screen. */
function laserRoar(auto) {
  if (G.state !== "run" || P.dead || G.beamT > 0) return;
  if (!auto && G.beamCd > 0) {
    toast("LASER RECHARGING " + (G.beamCd / 1000).toFixed(1) + "s");
    Snd.sfx.deny();
    return;
  }
  G.beamT = CFG.LASER_MS;
  G.beamCd = recharge(CFG.LASER_CD);
  G.beamY = GROUND - 43 - P.y + 13;
  G.flash = 26; shake(5, 18); Snd.sfx.roar();
  let n = 0;
  for (const o of G.obs) {
    if (o.dead || o.ridden) continue;
    o.dead = true; o.vx = 1.6; o.vy = -3.2; n++;
    burst(o.x + o.w / 2, o.y + o.h / 2, 16, 3, 22, CYAN);
    G.bonus += 10;
  }
  G.combo = 0; G.comboT = 0;
  toast(n ? "LASER ROAR!  x" + n : "LASER ROAR!");
}
/* --------------------------- the grappling hook ---------------------------- */
/* Fire a rope up to the nearest cloud or pterodactyl and swing through the air
   for three seconds, safely over the ground hazards, then detach with a NICE!. */
function hookTarget() {
  let best = null, bd = 1e9;
  const consider = (x, y, ref, cloud) => {
    if (x < P.x + 10 || x > WW - 6 || y > GROUND - 36 || y < 6) return;
    const d = (x - P.x) + Math.abs(y - (GROUND - 43 - P.y)) * 0.35;
    if (d < bd) { bd = d; best = { x, y, ref, cloud }; }
  };
  for (const o of G.obs) if (o.fly && !o.dead) consider(o.x + 12, o.y + 6, o, false);
  for (const c of G.clouds) consider(c.x + 20, c.y + 8, null, true);
  return best;
}
function hook() {
  if (!runInput()) return;
  if (P.hookT > 0) return;
  if (flying()) { Snd.sfx.deny(); return; }        /* stow the board first */
  const t = hookTarget();
  if (!t) { toast("NO ANCHOR - FIND A CLOUD OR PTERODACTYL"); Snd.sfx.deny(); return; }
  P.hook = t; P.hookT = CFG.HOOK_MS;
  P.vy = 0; P.air = 0; P.flip = -1; P.grind = null; P.sink = 0;
  G.combo = 0; G.comboT = 0;
  Snd.sfx.hook();
  toast("GRAPPLE!");
}
function updateHook(dt) {
  if (P.hookT <= 0) return;
  if (P.hook) {
    /* ride the anchor: a live bird moves with the world, a cloud just drifts */
    if (P.hook.ref && !P.hook.ref.dead) { P.hook.x = P.hook.ref.x + 12; P.hook.y = P.hook.ref.y + 6; }
    else P.hook.x -= G.spd;
    if (P.hook.x < -40) P.hookT = 0;
  }
  P.hookT -= dt;
  /* a smooth pendulum: rise to the top of the arc, then settle back down */
  const k = clamp(1 - Math.max(0, P.hookT) / CFG.HOOK_MS, 0, 1);
  P.y = CFG.HOOK_ARC * Math.sin(k * Math.PI) + CFG.HOVER_H * 0.4;
  P.vy = 0; P.air = 1; P.duck = false;
  if (G.frame % 6 === 0)
    G.parts.push({ x: P.x + 22, y: GROUND - P.y, vx: rnd(-1.6, -0.4), vy: rnd(-1, 0.3), life: 14, sz: 1, col: CYAN, soft: true });
  if (P.hookT <= 0) {
    P.hookT = 0; P.hook = null;
    P.vy = jumpV() * 0.45; P.air = 1;
    G.bonus += CFG.HOOK_PTS;
    toast("NICE!");
    Snd.sfx.point();
  }
}
/* bullet time: 35% speed for 2s, then a cooldown */
function slowMo() {
  if (G.state === "ready") { start(); return; }
  if (G.state === "win") { if (G.t > G.restartAt) start(); return; }
  if (G.state === "over") { if (G.t > G.restartAt) start(); return; }
  if (G.state === "pause") { G.state = "run"; Snd.start(); return; }
  if (G.state !== "run" || P.dead) return;
  if (G.slowT > 0 || G.slowCd > 0) { Snd.sfx.deny(); return; }
  G.slowT = CFG.SLOW_MS; G.slowCd = CFG.SLOW_MS + recharge(CFG.SLOW_CD);
  G.flash = 12; Snd.sfx.slow();
  burst(P.x + 20, GROUND - 22 - P.y, 14, 2.4, 20, CYAN);
}
/* ------------------------------ DINO PRO ---------------------------------- */

   one of these is a real line of code somewhere else — the list is the

/* ------------------------------- keyboard --------------------------------- */
const KEYS = {
  Space: "jump", KeyW: "jump", ArrowUp: "jump", KeyK: "jump",
  ArrowDown: "slide", KeyS: "slide", KeyA: "slide",
  KeyF: "rocket", KeyC: "parry", Enter: "action", KeyJ: "action", ArrowRight: "action",
  ShiftLeft: "slow", ShiftRight: "slow",
  KeyH: "board", KeyG: "hook", KeyR: "laser",
  KeyP: "pause", Escape: "pause", KeyM: "mute"
};
window.addEventListener("keydown", e => {
  if (G.state === "pro") {                             /* the VIP modal owns the keyboard */
    e.preventDefault();
    if (e.code === "Escape" || e.code === "KeyP") closePro();
    else if (e.code === "Space" || e.code === "Enter" || e.code === "KeyF") activatePro();
    return;
  }
  if (G.state === "shop") {                            /* the shop owns the keyboard */
    e.preventDefault();
    if (e.code === "Escape" || e.code === "KeyP") closeShop();
    /* the shop is a grid: up/down step a row, left/right step a column, and
       down off the last row lands on the full-width hoverboard pack */
    else if (e.code === "ArrowDown" || e.code === "KeyS") { G.shopSel = Math.min(SKINS.length, G.shopSel + SHOP_COLS); Snd.sfx.click(); }
    else if (e.code === "ArrowUp" || e.code === "KeyW") { G.shopSel = Math.max(0, G.shopSel - SHOP_COLS); Snd.sfx.click(); }
    else if (e.code === "ArrowRight" || e.code === "KeyD") { G.shopSel = Math.min(SKINS.length - 1, G.shopSel + 1); Snd.sfx.click(); }
    else if (e.code === "ArrowLeft" || e.code === "KeyA") { G.shopSel = Math.max(0, G.shopSel - 1); Snd.sfx.click(); }
    else if (e.code === "Space" || e.code === "Enter" || e.code === "KeyF") {
      if (G.shopSel >= SKINS.length + 1) closeShop(); else shopPick(G.shopSel);
    }
    return;
  }
  const a = KEYS[e.code];
  if (!a) return;
  e.preventDefault();
  if (e.repeat) return;
  Snd.init(); Snd.resume();
  if (a === "jump") jump();
  else if (a === "slide") held.keySlide = true;
  else if (a === "action") action();
  else if (a === "rocket") rocket();
  else if (a === "parry") parryPress();
  else if (a === "hook") hook();
  else if (a === "laser") laserRoar();
  else if (a === "slow") slowMo();
  else if (a === "board") deployBoard(false);
  else if (a === "pause") togglePause();
  else if (a === "mute") toggleSound();
}, { passive: false });
window.addEventListener("keyup", e => { if (KEYS[e.code] === "slide") held.keySlide = false; });
window.addEventListener("blur", () => { held.keySlide = false; held.padSlide = false; });

/* ---------------------------- on-screen gamepad ---------------------------- */
function bindButton(id, on, off) {
  const el = document.getElementById(id);
  if (!el) return;
  const down = e => {
    e.preventDefault(); e.stopPropagation();
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    el.classList.add("on");
    Snd.init(); Snd.resume();
    if (on) on();
  };
  const up = () => { el.classList.remove("on"); if (off) off(); };
  el.addEventListener("pointerdown", down);
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
  el.addEventListener("lostpointercapture", up);
  el.addEventListener("contextmenu", e => e.preventDefault());
}
bindButton("bGrind", slidePress, slideRelease);
bindButton("bSlow", slowMo);
bindButton("bParry", parryPress);
bindButton("bRocket", rocket);
bindButton("bHook", hook);
bindButton("bRide", () => deployBoard(false));
bindButton("bJump", () => jump());
bindButton("bPause", togglePause);
bindButton("bSound", toggleSound);
bindButton("bPro", openPro);

/* ------------- tap the field = JUMP · drag down = slide -------------------
   One gesture model, and it fires on the PRESS, not on the release.  Waiting
   for the finger to come up was what made the dino feel unresponsive, and it
   made a second tap in mid-air impossible to land at all — the old double-tap
   shortcut grabbed every quick second tap and spent it on the hoverboard
   instead.  Now: every press on the field is a jump, a second press while
   airborne is the 360 backflip double jump, a downward drag is a slide, and
   the hoverboard is only ever deployed by RIDE or H. */
let gest = null;
const isUi = t => !!(t && t.closest && (t.closest("#pad") || t.closest("#topbar")));
function fieldPress(e) {
  if (isUi(e.target)) return;
  Snd.init(); Snd.resume();
  const p = toWorld(e), hit = hitUI(p.x, p.y);
  if (hit) { onUI(hit); return; }
  gest = { id: e.pointerId, x: e.clientX, y: e.clientY, acted: false };
  /* the first tap is the door: it starts, resumes or restarts, and never jumps */
  if (G.state === "ready") { start(); return; }
  if (G.state === "over") { if (G.t > G.restartAt) resume(); return; }
  if (G.state === "win") { if (G.t > G.restartAt) { clearCheckpoint(); start(); } return; }
  if (G.state === "pause") { G.state = "run"; Snd.start(); return; }
  if (G.state === "run" && !P.dead) {
    gest.fromGround = P.y <= 0.01 && !flying() && !P.grind;
    jump();
  }
}
wrap.addEventListener("pointerdown", fieldPress, { passive: true });
/* Touch, belt and braces: pointer events cover every browser we run on, and
   this listener exists to kill the browser gestures that sit between a finger
   and the dino — the double-tap-zoom wait, scroll chaining, text selection.
   Touches on the top bar are left alone, because those chips need their own
   synthetic click (the INSTALL chip waits for one). */
wrap.addEventListener("touchstart", e => {
  if (isUi(e.target)) return;
  if (e.cancelable) e.preventDefault();
}, { passive: false });
wrap.addEventListener("pointermove", e => {
  if (!gest || e.pointerId !== gest.id || gest.acted) return;
  const dx = e.clientX - gest.x, dy = e.clientY - gest.y;
  if (Math.abs(dy) > 26 && Math.abs(dy) > Math.abs(dx)) {
    if (dy > 0) {
      /* a downward drag was always meant as a slide, not a hop: if the press
         had only just launched the dino off the ground, quietly cancel that
         hop so the gesture reads as one clean slide */
      if (gest.fromGround && P.y < 40) { P.y = 0; P.vy = 0; P.air = 0; P.flip = -1; }
      gest.acted = true; held.swipe = true; held.swipeUntil = G.t + 340;
    } else gest.acted = true;
  } else if (Math.abs(dx) > 34) gest.acted = true;
}, { passive: true });
wrap.addEventListener("pointerup", () => { gest = null; }, { passive: true });
wrap.addEventListener("pointercancel", () => { gest = null; });

/* --------------------------- show pad on touch ---------------------------- */
let touchUI = false;
function enableTouchUI() {
  if (touchUI) return;
  touchUI = true;
  if (document.body && document.body.classList) document.body.classList.add("touch");
  Snd.resume();
  resize();          /* the pad now needs its own band under the game */
}
if ((window.matchMedia && window.matchMedia("(pointer: coarse)").matches) || (navigator.maxTouchPoints || 0) > 0) enableTouchUI();
window.addEventListener("touchstart", enableTouchUI, { passive: true });
window.addEventListener("pointerdown", e => { if (e.pointerType === "touch") enableTouchUI(); }, { passive: true });
document.addEventListener("visibilitychange", () => { if (document.hidden && G.state === "run") { G.state = "pause"; Snd.stop(); } });

/* ------------------------------- world helpers ---------------------------- */
function shake(mag, t) { G.shakeM = mag; G.shakeT = t; }
/* night falls in phases: scene 1 is day, scene 2 night, scene 3 day again... */
function setNight(on) {
  if (G.night === on) return;
  G.night = on;
  const root = document.documentElement;
  if (root && root.classList) root.classList.toggle("night", on);
  /* the browser chrome (and the Android status bar in a TWA) follows the sky */
  const mt = document.getElementById("metaTheme");
  if (mt && mt.setAttribute) mt.setAttribute("content", on ? "#0e0e0e" : "#ffffff");
  Snd.setNight(on);
  if (on && !G.stars.length) for (let i = 0; i < 16; i++) G.stars.push({ x: rnd(WW), y: ri(8, 104), k: pick([1, 1, 1, 1.4, 1.8]), seed: ri(0, 140) });
}
function burst(x, y, n, spd, life, col) {
  for (let i = 0; i < n; i++) {
    const a = rnd(TAU);
    G.parts.push({ x, y, vx: Math.cos(a) * rnd(spd), vy: Math.sin(a) * rnd(spd) - 0.6, life: life + ri(0, 10), sz: ri(1, 2), col: col });
  }
}
function puff(x, y, n) {
  for (let i = 0; i < n; i++) G.parts.push({ x: x + ri(-4, 4), y, vx: rnd(-0.3, -1.5), vy: rnd(-0.6, 0.2), life: ri(10, 22), sz: ri(1, 2), soft: true });
}
/* A deliberately thin road.  counts is at most two wide (no more triple walls),
   minGap is generous, and GAPK below scales the whole thing up again.  Pairs of
   cacti are still the bread and butter; pterodactyls are the seasoning. */
const OBST = {
  cactus1: { w: 15, h: 33, minGap: 165, counts: [1, 2], box: [1, 2, 13, 30] },
  cactus2: { w: 23, h: 48, minGap: 165, counts: [1, 2], box: [1, 2, 21, 45] },
  ptero:   { w: 42, h: 36, minGap: 200, counts: [1],     box: [6, 6, 30, 24], fly: true }
};
function spawnObstacle() {
  let pool = ["cactus1", "cactus2"];
  if (G.score >= 130) pool.push("ptero");
  /* late game the pterodactyls are the accent, not the main course */
  if (G.score >= 380) pool = ["cactus1", "cactus1", "cactus2", "cactus2", "ptero"];
  const k = pick(pool), t = OBST[k];
  const n = t.fly ? 1 : pick(t.counts);
  const w = t.w * n;
  let y;
  if (t.fly) {
    const lane = pick(G.score > 500 ? [0, 1, 2] : [0, 1]);
    y = lane === 0 ? GROUND - t.h : lane === 1 ? GROUND - t.h - 30 : GROUND - t.h - 58;
  } else y = GROUND - t.h;
  const minGap = Math.round((w * G.speed + t.minGap * 0.6) * CFG.GAPK);
  G.obs.push({
    k, n, x: WW + 8, y, w, h: t.h, box: t.box, fly: !!t.fly,
    /* the gap varies a lot on purpose: a run of calm opens up between the
       clusters, so the road breathes instead of arriving on a metronome */
    f: 0, fanim: 0, gap: Math.round(minGap * rnd(2.1, 1.2)), dead: false, vx: 0, vy: 0, ridden: false
  });
}
function maybeSpawn() {
  if (G.boss) return;                               /* the router owns the road */
  if (!G.obs.length) { spawnObstacle(); return; }
  const last = G.obs[G.obs.length - 1];
  if (!last.dead && last.x + last.w + last.gap <= WW) spawnObstacle();
}
function boxesOf(o) {
  const out = [], b = o.box, step = OBST[o.k].w;
  for (let i = 0; i < o.n; i++) out.push([o.x + i * step + b[0], o.y + b[1], b[2], b[3]]);
  return out;
}
function dinoBoxes() {
  if (P.duck && P.y <= 0.01) return [[P.x - 4, GROUND - 21, 44, 19]];
  const y = GROUND - 43 - P.y;
  return [[P.x + 5, y + 1, 24, 36], [P.x + 20, y, 19, 15]];
}
const hitBox = (a, b) => a[0] < b[0] + b[2] && a[0] + a[2] > b[0] && a[1] < b[1] + b[3] && a[1] + a[3] > b[1];
function hitsObstacle(o) {
  const db = dinoBoxes(), ob = boxesOf(o);
  for (let i = 0; i < ob.length; i++) for (let j = 0; j < db.length; j++) if (hitBox(db[j], ob[i])) return true;
  return false;
}
/* ----------------------------- collectibles ------------------------------- */
const ITEM = { coin: { w: 11, h: 8, spr: "wifi" }, rocket: { w: 13, h: 9, spr: "rocket" },
               board: { w: 26, h: 14, spr: "pkBoard" }, spy: { w: 24, h: 16, spr: "pkSpy" } };
function spawnItems(boss) {
  const x = WW + 24 + rnd(0, 70);
  for (const o of G.obs) if (!o.dead && o.x + o.w > x - 52 && o.x < x + 52 + o.w) return;   /* keep gaps clean */
  G.itemN++;
  /* while a boss owns the road the track feeds you missiles instead of coins,
     so no gate can outlast the ammo you walked in with */
  if (boss) { G.items.push({ k: "rocket", x, y: GROUND - 30, w: 13, h: 9 }); return; }
  /* rare power-up drops: a hoverboard, or the incognito spy hat */
  if (G.itemN % CFG.BOARD_EVERY === 0 && !P.board) {
    G.items.push({ k: "board", x, y: GROUND - 34, w: 26, h: 14 }); return;
  }
  if (G.itemN % CFG.SPY_EVERY === 0 && !P.spy) {
    G.items.push({ k: "spy", x, y: GROUND - 40, w: 24, h: 16 }); return;
  }
  if (G.itemN % CFG.ROCKET_EVERY === 0) G.items.push({ k: "rocket", x, y: GROUND - 30, w: 13, h: 9 });
  else {
    const h = pick([14, 54, 78]);                   /* ground, jump, big jump */
    for (let i = 0; i < 3; i++) G.items.push({ k: "coin", x: x + i * 19, y: GROUND - h, w: 11, h: 8 });
  }
}
function collect(it) {
  if (it.k === "coin") {
    const n = save.pro ? CFG.PRO_COINS : 1;      /* PRO: double coins */
    save.coins += n; G.coinN++; G.bonus += 1;
    if (G.coinN % 10 === 0) persist();
    burst(it.x + 5, it.y + 4, 6, 1.8, 12, save.pro ? GOLD : null);
    Snd.sfx.coin();
  } else if (it.k === "board") {
    save.boards = Math.min(99, save.boards + 1); persist();
    burst(it.x + 13, it.y + 7, 16, 2.6, 22, GOLD); Snd.sfx.buy();
    toast("HOVERBOARD +1  (" + save.boards + " IN STOCK)");
  } else if (it.k === "spy") {
    grantSpy();
    burst(it.x + 12, it.y + 8, 18, 2.8, 24, mixHex(SOFT, PAPER, 0.2));
  } else {
    G.ammo = Math.min(CFG.AMMO_MAX, G.ammo + CFG.BOX_AMMO);   /* the [ROCKET] box carries three */
    burst(it.x + 6, it.y + 4, 14, 2.6, 16, RED);
    Snd.sfx.ammo();
  }
}
/* hold SLIDE while dropping onto a cactus crown to rail-grind it */
function tryGrind() {
  if (P.grind || P.dead || !slideHeld()) return;
  const nose = P.x + 40;
  for (const o of G.obs) {
    if (o.fly || o.dead || o.ridden) continue;
    if (!(o.x < nose - 3 && o.x + o.w > P.x + 6)) continue;
    if (P.y > o.h - 9 && P.y < o.h + 26 && P.vy <= 3) {
      P.grind = o; P.y = o.h; P.vy = 0; P.flip = -1; o.ridden = true;
      Snd.sfx.grind(); shake(2, 8);
      toast("SICK GRIND!");
      bumpCombo(1);
      return;
    }
  }
}

/* --------------------------------- update --------------------------------- */
function update() {
  G.t += STEP; G.frame++; G.blink++;
  if (G.shakeT > 0) G.shakeT--;
  if (G.flash > 0) G.flash--;
  if (G.cool > 0) G.cool = Math.max(0, G.cool - STEP / 1000);
  if (G.shopMsgT > 0) G.shopMsgT--;
  if (G.proMsgT > 0) G.proMsgT--;
  if (G.toastT > 0) G.toastT--;
  if (G.warn > 0) G.warn--;
  if (G.cpFlash > 0) G.cpFlash--;
  if (G.slowT > 0) G.slowT = Math.max(0, G.slowT - STEP);
  if (G.slowCd > 0) G.slowCd = Math.max(0, G.slowCd - STEP);
  if (G.comboT > 0) { G.comboT = Math.max(0, G.comboT - STEP); if (G.comboT === 0) G.combo = 0; }
  if (G.beamT > 0) G.beamT = Math.max(0, G.beamT - STEP);
  if (G.beamCd > 0) G.beamCd = Math.max(0, G.beamCd - STEP);
  if (G.state === "run" && !P.dead) updatePowerups(STEP);
  if (P.shield > 0) P.shield = Math.max(0, P.shield - STEP);
  if (held.swipe && gest && gest.acted) held.swipeUntil = G.t + 220;
  if (G.state === "pause") return;

  const running = G.state === "run" && !P.dead;
  G.spd = G.speed * (G.slowT > 0 ? CFG.SLOW_SCALE : 1);
  const drift = running ? G.spd : 2;

  /* dusk: cross-fade the whole palette, then drift the starfield */
  const wantNight = G.night ? 1 : 0;
  if (G.nightMix !== wantNight) {
    const dn = 1 / CFG.NIGHT_FADE;
    G.nightMix = wantNight > G.nightMix ? Math.min(1, G.nightMix + dn) : Math.max(0, G.nightMix - dn);
  }
  if (G.stars.length) for (const s of G.stars) {
    s.x -= drift * 0.06 * s.k;
    if (s.x < -24) { s.x = WW + rnd(0, 140); s.y = ri(8, 104); }
  }
  if (G.state === "shop" || G.state === "pro") return;   /* the track is frozen, the sky isn't */

  /* Clouds are always in the sky, on every screen: they are the scenery, and
     they are also the only anchor a grappling hook can reach.  They spawn in a
     band that is low enough to hook (the hook reaches y <= 124) and high enough
     to stay clear of the road and of the dino's own jump arc. */
  if (--G.cloudT <= 0 && G.clouds.length < CFG.CLOUD_MAX) {
    G.clouds.push({ x: WW + 12, y: ri(CFG.CLOUD_MIN_Y, CFG.CLOUD_MAX_Y), s: rnd(1.3, 0.75) });
    G.cloudT = ri(CFG.CLOUD_MIN_GAP, CFG.CLOUD_MAX_GAP);
  }
  for (let i = G.clouds.length - 1; i >= 0; i--) {
    const c = G.clouds[i];
    c.x -= drift * 0.2 * c.s;
    if (c.x < -60) G.clouds.splice(i, 1);
  }
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i];
    p.x += p.vx; p.y += p.vy;
    if (!p.soft) p.vy += 0.2;
    if (p.conf) { p.vx += Math.sin((p.y + G.frame) / 9) * 0.12; if (p.y > GROUND) p.life = Math.min(p.life, 12); }
    if (--p.life <= 0) G.parts.splice(i, 1);
  }
  if (G.state === "ready") return;
  if (G.state === "win") { winUpdate(); return; }
  if (P.dead) return;

  /* -------------------------------- player -------------------------------- */
  const wantDuck = slideHeld();
  if (P.hookT > 0) {
    updateHook(STEP);                       /* the pendulum owns the dino's height */
  } else if (P.grind) {
    const o = P.grind;
    P.y = o.h; P.vy = 0;
    if (G.frame % 5 === 0) Snd.sfx.grind();
    if (G.frame % 6 === 0) {
      G.parts.push({ x: P.x + ri(0, 34), y: GROUND - P.y + ri(-5, 0), vx: rnd(-0.6, -2.2), vy: rnd(-1.7, -0.2), life: ri(8, 16), sz: 1 });
      G.distance += 4; G.bonus += 1;
    }
    if (o.x + o.w < P.x + 8) { P.grind = null; P.vy = 0; }
  } else if (!flying() && (P.y > 0.01 || P.vy > 0)) {
    /* airborne: integrate.  A fresh jump only sets P.vy, so this must run on
       the very frame the jump starts, before the landing test can reset it.
       A flying dino is skipped: the board's own branch in updatePowerups
       integrates its hop against the deck as the floor, not the road. */
    P.vy -= (wantDuck ? CFG.FAST_GRAVITY : CFG.GRAVITY);
    P.y += P.vy;
    if (P.y <= 0) {
      P.y = 0; P.vy = 0; P.air = 0; P.flip = -1;
      Snd.sfx.land(); puff(P.x + 20, GROUND, 4);
    }
  } else if (!flying()) { P.y = 0; P.vy = 0; P.air = 0; }   /* snap the last sub-pixel of the landing */
  if (P.flip >= 0 && P.flip < 1) P.flip = Math.min(1, P.flip + 0.045);
  P.duck = wantDuck && P.y <= 0.01 && !P.grind && P.hookT <= 0;
  /* the jump trajectory: a short history of heights drawn as a dotted trail */
  if (P.y > 0.01 && P.hookT <= 0 && !flying()) { G.arc.unshift(P.y); if (G.arc.length > 12) G.arc.pop(); }
  else if (G.arc.length) G.arc.length = 0;

  /* --------------------------------- world -------------------------------- */
  /* a slow, relaxed start that eases into the sprint.  The first EASE_IN units
     (10,500m) are held at walking pace so the opening is genuinely calm, then a
     smoothstep carries the pace the rest of the way to the tower. */
  const t = clamp((G.road - CFG.EASE_IN) / (CFG.RAMP - CFG.EASE_IN), 0, 1);
  const ease = t * t * (3 - 2 * t);
  G.speed = CFG.SPEED + (CFG.MAX_SPEED - CFG.SPEED) * ease;
  G.spd = G.speed * (G.slowT > 0 ? CFG.SLOW_SCALE : 1);
  G.distance += G.spd;
  if (!G.boss) G.road += G.spd;
  G.meters = Math.min(CFG.FINISH, Math.floor(G.road * CFG.M_PER_UNIT));
  G.score = Math.floor(G.distance * 0.025) + G.bonus;
  if (G.meters >= CFG.FINISH) { win(); return; }
  /* checkpoints: a snapshot every 10,000m, so a crash is never a total loss */
  const cpN = Math.floor(G.meters / CFG.CHECKPOINT);
  if (cpN > G.cpN) { G.cpN = cpN; writeCheckpoint(); G.cpFlash = 90; Snd.sfx.buy(); toast("CHECKPOINT " + fmtM(cpN * CFG.CHECKPOINT) + "m SAVED"); }
  if (!G.boss && G.bossIdx < BOSSES.length && G.meters >= BOSSES[G.bossIdx].at) bossStart(G.bossIdx);
  if (G.boss) { bossUpdate(); if (P.dead) return; }
  if (--G.itemT <= 0) { G.itemT = G.boss ? ri(30, 56) : ri(130, 300); spawnItems(!!G.boss); }
  for (let i = G.items.length - 1; i >= 0; i--) {
    const it = G.items[i], ib = [it.x, it.y, it.w, it.h];
    it.x -= G.spd;
    if (it.x + it.w < -24) { G.items.splice(i, 1); continue; }
    /* PRO's magnet: a coin inside the radius is reeled into the dino's hands,
       so the high row you would have had to jump for comes to you instead */
    const mag = magnet();
    if (mag > 0 && it.k === "coin") {
      const dx = (P.x + 22) - it.x, dy = (GROUND - 26 - P.y) - it.y, d = Math.sqrt(dx * dx + dy * dy);
      if (d < mag && d > 0.5) { it.x += dx / d * CFG.MAG_PULL; it.y += dy / d * CFG.MAG_PULL; }
    }
    const db = dinoBoxes();
    /* The board rides higher than the road, so on the deck the dino's reach
       hangs down to the tarmac: hovering must never mean sailing over the low
       coin row.  The high row still wants a hop, exactly as it does on foot. */
    const boxes = flying()
      ? [[db[0][0], db[0][1], db[0][2], GROUND - 6 - db[0][1]]]
      : db;
    if (boxes.some(b => hitBox(b, ib))) { collect(it); G.items.splice(i, 1); }
  }
  if (G.score >= G.flashPeak + 100) { G.flashPeak = Math.floor(G.score / 100) * 100; G.flash = 22; Snd.sfx.point(); }
  const phase = Math.floor(G.score / CFG.NIGHT_AT);          /* dusk milestone */
  if (phase !== G.nightPhase) { G.nightPhase = phase; setNight(phase % 2 === 1); G.flash = 22; Snd.sfx.point(); }

  for (let i = G.obs.length - 1; i >= 0; i--) {
    const o = G.obs[i];
    if (o.fly && o.fanim++ % 6 === 0) o.f = (o.f + 1) % 2;
    if (o.dead) {
      o.vx += 0.12; o.x += o.vx; o.y += o.vy;
      if (o.y < -60 || o.x > WW + 40) G.obs.splice(i, 1);
      continue;
    }
    o.x -= G.spd;
    if (o.x + o.w < -30) G.obs.splice(i, 1);
  }
  maybeSpawn();

  for (let i = G.shots.length - 1; i >= 0; i--) {
    const s = G.shots[i];
    s.x += 13;
    if (G.frame % 2 === 0) G.parts.push({ x: s.x - 4, y: s.y + 2, vx: rnd(-1.5, -0.6), vy: rnd(-0.3, 0.3), life: 12, sz: 1, soft: true });
    let hit = false;
    /* a shot from the board carries its blast down to the road; a shot from the
       dino's own hands is the little 18x5 missile it always was */
    const sb = [s.x, s.y, 18, s.board ? Math.max(5, GROUND - s.y) : 5];
    const b = G.boss;
    if (b && hitBox(sb, bossBox(b))) { bossHit(1, s.x, s.y); hit = true; }
    for (const o of G.obs) {
      if (o.dead) continue;
      if (hitBox(sb, [o.x, o.y, o.w, o.h])) {
        o.dead = true; o.vy = -4;
        burst(o.x + o.w / 2, o.y + o.h / 2, 22, 3.4, 24);
        G.bonus += 25; G.flash = 14; shake(3, 12); Snd.sfx.boom();
        bumpCombo(1);
        hit = true; break;
      }
    }
    if (hit || s.x > WW + 24) G.shots.splice(i, 1);
  }

  /* ---------------------------- grind & collide --------------------------- */
  tryGrind();
  /* incognito: the dino is intangible, so cacti and birds simply pass through */
  if (phasing()) {
    for (const o of G.obs) {
      if (o.dead || o.ridden || !hitsObstacle(o)) continue;
      o.dead = true; o.vx = 1.6; o.vy = -3;
      burst(o.x + o.w / 2, o.y + o.h / 2, 10, 2.2, 18, mixHex(SOFT, PAPER, 0.3));
      G.bonus += 10;
    }
  } else if (P.shield <= 0 && !P.grind && P.hookT <= 0) for (const o of G.obs) {
    if (o.dead || o.ridden) continue;
    if (hitsObstacle(o)) {
      /* the hoverboard takes the hit so the run does not */
      if (flying()) {
        loseBoard();
        for (const q of G.obs) if (!q.dead && q.x + q.w > P.x - 20 && q.x < P.x + 120) {
          q.dead = true; q.vx = 2.4; q.vy = -5;
        }
        return;
      }
      gameOver(pick(REASONS)); return;
    }
  }
}

/* --------------------------- buttons & the shop --------------------------- */
const ui = [];
function hitUI(x, y) {
  for (let i = ui.length - 1; i >= 0; i--) {
    const b = ui[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
  }
  return null;
}
/* A raised pixel panel: hard 2px ink border, a soft drop shadow to lift it off
   the paper, and a hairline inner rule so the content has a margin to sit on. */
function panel(x, y, w, h) {
  R(x + 2, y + 3, w, h, mixHex(INK, PAPER, 0.86));          /* drop shadow */
  R(x, y, w, h, PAPER);
  R(x, y, w, 2, INK); R(x, y + h - 2, w, 2, INK);
  R(x, y, 2, h, INK); R(x + w - 2, y, 2, h, INK);
  R(x + 4, y + 4, w - 8, 1, mixHex(INK, PAPER, 0.88));      /* inner hairline */
}

  const sk = SKINS[i];

    if (save.coins < sk.cost) { shopMsg("NOT ENOUGH COINS - NEED " + (sk.cost - save.coins)); Snd.sfx.deny(); return; }

function dinoKey() {

function drawDino() {

  const r = 10 + ((G.blink / 4) | 0) % 3, cy = GROUND - 24 - P.y;
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * TAU + G.blink / 20;
    R(P.x + 42 + Math.cos(a) * r, cy + Math.sin(a) * r, 2, 2, CYAN);
  }
}
/* the jump reads as an arc: a dotted cyan trail of where the dino has been */
function drawTrajectory() {
  if (G.arc.length < 2) return;
  for (let i = 0; i < G.arc.length; i++) {
    const y = GROUND - 22 - G.arc[i];
    const x = P.x + 2 - i * 3.4;
    const a = 1 - i / (G.arc.length + 1);
    R(x, y, 2, 2, mixHex(CYAN, PAPER, 0.18 + 0.5 * a));
  }
}
/* the grappling rope, its anchor, and the GRAPPLE! shout.
   The rope is a solid ink line with a small sag, drawn segment by segment from
   the dino's hands all the way up to the cloud it has caught — a continuous
   line reads as a rope where a dotted one reads as sparks. */
function drawHook() {
  if (P.hookT <= 0 || !P.hook) return;
  const dx = P.x + 20, dy = GROUND - P.y - 40;
  const hx = P.hook.x, hy = P.hook.y;
  const n = 26, rope = mixHex(INK, PAPER, 0.06);
  let px = dx, py = dy;
  for (let i = 1; i <= n; i++) {
    const t = i / n;
    const x = dx + (hx - dx) * t;
    const y = dy + (hy - dy) * t + Math.sin(t * Math.PI) * 6;   /* a little slack */
    const sx = x - px, sy = y - py, len = Math.max(1, Math.hypot(sx, sy));
    for (let s = 0; s < len; s += 2) {
      const u = s / len;
      R(px + sx * u - 1, py + sy * u - 1, 3, 2, rope);
    }
    px = x; py = y;
  }
  /* the hook itself, biting into the cloud */
  R(hx - 5, hy - 2, 10, 3, INK);
  R(hx - 5, hy - 5, 2, 4, INK);
  R(hx + 3, hy - 5, 2, 4, INK);
  R(hx - 1, hy + 1, 2, 4, RED);
  TXT("GRAPPLE!", WW / 2, 92, 17, RED, "center", 2.6);
}
/* the Laser Roar beam, fired from the dino's mouth across the whole screen */
function drawBeam() {
  if (G.beamT <= 0) return;
  const a = G.beamT / CFG.LASER_MS, y = G.beamY, hgt = 3 + 6 * a;
  R(0, y - hgt / 2, P.x + 22, hgt, mixHex(CYAN, PAPER, 0.3));
  R(P.x + 18, y - hgt / 2, WW - P.x, hgt, CYAN);
  R(P.x + 18, y - 1, WW - P.x, 2, PAPER);
  for (let i = 0; i < 5; i++) R(P.x + 24 + i * 6, y - 6 + i, 3, 12 - i * 2, mixHex(CYAN, PAPER, 0.45));
}

     A page turn costs no panel height, so the wardrobe scales to any number
     of skins without a row ever running into the pack or CLOSE below it. */
  const pages = shopPages(), page = shopPage();
  const first = page * SHOP_PER, last = Math.min(SKINS.length, first + SHOP_PER);

       so neither can ever run into the other in a 156px column */
    if (eq) TXT("EQUIPPED", rx + rw - 6, ry + 12, 9, INK, "right", 1);
    else if (owned) TXT("EQUIP", rx + rw - 6, ry + 12, 9, INK, "right", 1);
    else {

    }
    if (sel) { R(rx, ry, rw, 1, INK); R(rx, ry + 25, rw, 1, INK); R(rx, ry, 1, 26, INK); R(rx + rw - 1, ry, 1, 26, INK); }
  }
  /* the hoverboard pack: a consumable row below the grid, same shape */
  {
    const rx = x + 12, rw = w - 24, ry = y + 42 + SHOP_ROWS * 28;

    if (sel) R(rx, ry, rw, 26, mixHex(INK, PAPER, 0.9));
    ui.push({ x: rx, y: ry, w: rw, h: 26, id: "boardpack" });
    SPT("board", rx + 6, ry + 9, 0, 0, GOLD, 0.52);

    TXT("3 boards · H or double-tap to fly", rx + 34, ry + 21, 7, SOFT, "left");
    if (save.boards > 0) TXT("IN STOCK " + save.boards, rx + rw - 10, ry + 17, 8, GOLD, "right", 1);
    else { SPT("wifi", rx + rw - 78, ry + 8, 0); TXT(String(CFG.BOARD_COST), rx + rw - 10, ry + 17, 9, afford ? INK : FAINT, "right"); }
    if (sel) { R(rx, ry, rw, 1, INK); R(rx, ry + 25, rw, 1, INK); R(rx, ry, 1, 26, INK); R(rx + rw - 1, ry, 1, 26, INK); }
  }
  if (G.shopMsgT > 0) TXT(G.shopMsg, WW / 2, y + h - 26, 9, INK, "center", 0.8);
  else TXT(touchUI ? "TAP TO BUY OR EQUIP" : "↑↓←→ SELECT · ENTER BUY · P CLOSE", WW / 2, y + h - 26, 8, SOFT, "center");
  /* the page turners share the bottom row with CLOSE, so the grid never grows */
  if (pages > 1) {
    button(x + 12, y + h - 20, 26, 15, "shopprev", "◀", 9, false);
    button(x + 42, y + h - 20, 26, 15, "shopnext", "▶", 9, false);

/* A filled disc, or a squashed ellipse when `ry` is given — the hoverboard
   throws a flat pool of light on the road with it. */
function disc(cx, cy, r, col, ry) {
  const b = ry === undefined ? r : ry;
  for (let y = -b; y <= b; y++) {
    const w = Math.floor(Math.sqrt(Math.max(0, r * r * (1 - (y * y) / (b * b)))));
    R(cx - w, cy + y, w * 2 + 1, 1, col);
  }
}
function drawSky() {
  if (G.nightMix <= 0.02) return;
  const mx = 104, my = 38, mr = 11;                 /* crescent moon, upper left */
  disc(mx, my, mr, STAR);
  disc(mx + 6, my - 3, mr - 2, PAPER);
  for (const s of G.stars) {
    if ((G.frame + s.seed) % 140 < 7) continue;     /* twinkle */
    if (s.x > mx - 18 && s.x < mx + 18 && s.y > my - 18 && s.y < my + 18) continue;  /* keep the moon clear */
    SPT("star", s.x, s.y, 0, 0, STAR, s.k);
  }
}
function render() {
  applyNight(G.nightMix);
  ui.length = 0;
  /* a full-screen panel owns the screen: fade the touch pad out from under it */
  if (document.body && document.body.classList)
    document.body.classList.toggle("modal", G.state === "pro" || G.state === "shop");
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, CW, CH);
  OX = G.shakeT > 0 ? Math.round(rnd(G.shakeM, -G.shakeM) * S) : 0;
  OY = G.shakeT > 0 ? Math.round(rnd(G.shakeM, -G.shakeM) * S) : 0;

  drawSky();
  for (const c of G.clouds) SPT("cloud", c.x, c.y, 0, 0, CLOUD);
  drawGround();
  drawObstacles();
  drawItems();
  drawEffects();
  drawBoss();
  drawBeam();
  drawParryHint();
  drawTrajectory();
  drawDino();
  drawHook();

  OX = 0; OY = 0;
  drawHud();
  if (G.state === "ready") drawReady();
  else if (G.state === "over") drawOver();
  else if (G.state === "win") drawWin();
  else if (G.state === "shop") drawShop();
  else if (G.state === "pro") drawPro();
  else if (G.state === "pause") drawPause();

  const rkt = document.getElementById("bRocket");
  if (rkt) rkt.classList.toggle("dim", G.state === "run" && (G.ammo === 0 || G.cool > 0));
  const hk = document.getElementById("bHook");
  if (hk) hk.classList.toggle("dim", G.state === "run" && P.hookT > 0);
  const rd = document.getElementById("bRide");
  if (rd) rd.classList.toggle("dim", G.state === "run" && !flying() && save.boards <= 0 && !save.pro);
  const slw = document.getElementById("bSlow");
  if (slw) {
    const cooling = G.slowCd > 0;
    slw.classList.toggle("dim", cooling);
    const label = cooling ? (G.slowCd / 1000).toFixed(1) + "s" : "SLOW";
    if (slw.textContent !== label) slw.textContent = label;
  }
}

/* ---------------------------------- loop ---------------------------------- */
let acc = 0, last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  let dt = now - last; last = now;
  if (dt > 250) dt = 250;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 8) { update(); acc -= STEP; n++; }
  if (n >= 8) acc = 0;
  Snd.pump();
  render();
}

/* ------------------------------ install as an app --------------------------
   The game is a normal web page first and an app second: it ships a manifest
   and a service worker, so a browser offers "Add to Home Screen" and the same
   URL can be wrapped into a real Android APK with a Trusted Web Activity.  The
   INSTALL chip is only ever shown when the browser has offered a prompt. */
const installChip = document.getElementById("bInstall");
let installEvt = null;
function refreshInstallChip() { if (installChip) installChip.hidden = !installEvt; }
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); installEvt = e; refreshInstallChip();
});
window.addEventListener("appinstalled", () => { installEvt = null; refreshInstallChip(); });
/* pointerdown, not click: a touch tap has to reach this before any gesture
   handling can get between the finger and the browser's install prompt */
if (installChip) installChip.addEventListener("pointerdown", e => {
  e.preventDefault();
  if (!installEvt) return;
  try { installEvt.prompt(); } catch (err) {}
  installEvt = null; refreshInstallChip();
});
/* the worker is what makes the game work with no network at all — which is
   the entire joke of the game, and also what a TWA needs to be installable */
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}

/* ---------------------------------- boot ---------------------------------- */
resize();
refreshSoundChip();
refreshProChip();
refreshInstallChip();
requestAnimationFrame(frame);
</script>
